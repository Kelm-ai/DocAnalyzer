name: UI Media (PR)

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ui-media-pr.yml"

jobs:
  ui-media:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend build checks
        run: npm run build

