<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Board — Claude Compliance Report</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #faf7f2;
    color: #5a4a3f;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* --- Header --- */
  .header {
    background: #fffdf9;
    border-bottom: 1px solid #ebe4da;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-left .doc-name {
    font-weight: 600;
    font-size: 15px;
    color: #3d2e23;
  }

  .header-left .separator {
    color: #d1d5db;
    font-weight: 300;
  }

  .header-left .framework {
    font-size: 12px;
    font-weight: 500;
    background: #f5f0e8;
    color: #5a4a3f;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .header-left .score {
    font-size: 13px;
    font-weight: 600;
    color: #da7756;
  }

  .header-left .date {
    font-size: 12px;
    color: #a89888;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #a89888;
  }

  .header-right .ai-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fffdf9;
    border: 1px solid #e0d6ca;
    color: #a89888;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
  }

  .header-right .ai-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #da7756;
    display: inline-block;
  }

  /* --- Progress bar --- */
  .progress-section {
    background: #fffdf9;
    border-bottom: 1px solid #ebe4da;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 49px;
    z-index: 99;
  }

  .progress-label {
    font-size: 12px;
    color: #8a7a6e;
    white-space: nowrap;
    min-width: 140px;
  }

  .progress-label strong {
    color: #5a4a3f;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: #ebe4da;
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #da7756;
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .progress-pct {
    font-size: 12px;
    font-weight: 600;
    color: #5a4a3f;
    min-width: 36px;
    text-align: right;
  }

  /* --- Board --- */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    min-height: calc(100vh - 110px);
    padding: 0;
  }

  .column {
    border-right: 1px solid #ebe4da;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .column:last-child {
    border-right: none;
  }

  .column-header {
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 85px;
    z-index: 10;
  }

  .column[data-column="needs-review"] .column-header { background: #fef6ee; }
  .column[data-column="approved"] .column-header { background: #f3f8f0; }
  .column[data-column="rejected"] .column-header { background: #fdf0ed; }
  .column[data-column="auto-passed"] .column-header { background: #f5f0e8; }

  .column-header .col-icon {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .column[data-column="needs-review"] .col-icon { background: #d4912a; }
  .column[data-column="approved"] .col-icon { background: #5a9a6a; }
  .column[data-column="rejected"] .col-icon { background: #c44040; }
  .column[data-column="auto-passed"] .col-icon { background: #b5a99a; }

  .column-header .col-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #3d2e23;
  }

  .column-header .col-count {
    font-size: 11px;
    font-weight: 600;
    color: #8a7a6e;
    background: #fff;
    border: 1px solid #ebe4da;
    padding: 0 6px;
    border-radius: 10px;
    line-height: 18px;
  }

  .column-body {
    flex: 1;
    padding: 8px 10px 16px;
    overflow-y: auto;
  }

  .column[data-column="needs-review"] .column-body { background: #fefaf5; }
  .column[data-column="approved"] .column-body { background: #f8faf6; }
  .column[data-column="rejected"] .column-body { background: #fef7f5; }
  .column[data-column="auto-passed"] .column-body { background: #f8f5f0; }

  .column-empty {
    text-align: center;
    padding: 40px 16px;
    color: #a89888;
    font-size: 12px;
    font-style: italic;
  }

  /* --- Card --- */
  .card {
    background: #fff;
    border: 1px solid #ebe4da;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease, opacity 0.3s ease;
    position: relative;
  }

  .card:hover {
    box-shadow: 0 2px 8px rgba(90,74,63,0.1);
  }

  .card.moving-out {
    opacity: 0;
    transform: scale(0.95) translateY(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .card.moving-in {
    animation: cardIn 0.3s ease forwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
  }

  .status-dot.fail { background: #c44040; }
  .status-dot.flagged { background: #d4912a; }
  .status-dot.pass { background: #5a9a6a; }
  .status-dot.na { background: #b5a99a; }

  .card-main {
    flex: 1;
    min-width: 0;
  }

  .card-id {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 10px;
    color: #a89888;
    letter-spacing: 0.02em;
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: #5a4a3f;
    margin: 2px 0 6px;
    line-height: 1.35;
  }

  .card-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    padding: 1px 6px;
    border-radius: 3px;
    line-height: 16px;
  }

  .badge-clause {
    background: #f5f0e8;
    color: #5a4a3f;
  }

  .badge-confidence {
    border: 1px solid #ebe4da;
    color: #8a7a6e;
    background: #fff;
  }

  .badge-confidence.high { color: #4a8a5a; border-color: #b8d8b8; background: #f0f7f0; }
  .badge-confidence.medium { color: #b87a20; border-color: #f0ddb0; background: #fef7ea; }
  .badge-confidence.low { color: #c44040; border-color: #f4c4b8; background: #fef0ed; }

  .card-summary {
    font-size: 12px;
    color: #8a7a6e;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-expand-hint {
    font-size: 10px;
    color: #a89888;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-expand-hint .chevron {
    transition: transform 0.2s ease;
    display: inline-block;
  }

  .card.expanded .card-expand-hint .chevron {
    transform: rotate(90deg);
  }

  .card.expanded .card-summary {
    -webkit-line-clamp: unset;
  }

  /* --- Card Detail (expanded) --- */
  .card-detail {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f0ebe3;
  }

  .card.expanded .card-detail {
    display: block;
    animation: detailIn 0.2s ease;
  }

  @keyframes detailIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .detail-section {
    margin-bottom: 10px;
  }

  .detail-section:last-child {
    margin-bottom: 0;
  }

  .detail-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #a89888;
    margin-bottom: 3px;
  }

  .detail-text {
    font-size: 12px;
    color: #5a4a3f;
    line-height: 1.55;
  }

  .detail-quote {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 12px;
    color: #5a4a3f;
    line-height: 1.55;
    border-left: 2px solid #da7756;
    padding-left: 10px;
    font-style: italic;
  }

  /* --- Action buttons --- */
  .card-actions {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .btn {
    font-size: 11px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 5px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    line-height: 1;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-approve {
    background: #da7756;
    color: #fff;
    border-color: #da7756;
  }

  .btn-approve:hover {
    background: #c4674a;
  }

  .btn-reject {
    background: #fff;
    color: #c44040;
    border-color: #f4c4b8;
  }

  .btn-reject:hover {
    background: #fef0ed;
  }

  .btn-move-review {
    background: #fff;
    color: #8a7a6e;
    border-color: #ebe4da;
  }

  .btn-move-review:hover {
    background: #f5f0e8;
  }

  .btn-challenge {
    background: #fff;
    color: #d4912a;
    border-color: #f0ddb0;
  }

  .btn-challenge:hover {
    background: #fef7ea;
  }

  /* --- Responsive --- */
  @media (max-width: 1100px) {
    .board {
      grid-template-columns: repeat(2, 1fr);
    }
    .column {
      border-bottom: 1px solid #ebe4da;
    }
  }

  @media (max-width: 600px) {
    .board {
      grid-template-columns: 1fr;
    }
    .header {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>
</head>

    evidence: '"Risk treatment plans will be developed following the completion of the formal risk assessment process currently under development." (Section 7.2, p.30)',
    gap: 'This requirement cannot be assessed until the risk assessment process (REQ-6.1.2) is established. The risk treatment implementation depends on having a completed risk assessment with identified risks and selected treatment options.',
    recommendation: 'Address REQ-6.1.2 first, then develop risk treatment plans for all identified risks. Ensure treatment plans include: selected treatment options, justification, responsible parties, timelines, and expected residual risk levels.',
    column: 'auto-passed'
  }
];

// ─── State ───────────────────────────────────────────────────────────────
// Track current column for each requirement
const cardState = {};
requirements.forEach(r => {
  cardState[r.id] = r.column;
});

// ─── Rendering ───────────────────────────────────────────────────────────
function renderBoard() {
  const columns = {
    'needs-review': document.getElementById('col-needs-review'),
    'approved': document.getElementById('col-approved'),
    'rejected': document.getElementById('col-rejected'),
    'auto-passed': document.getElementById('col-auto-passed')
  };

  // Clear all columns
  Object.values(columns).forEach(col => col.innerHTML = '');

  // Counts
  const counts = { 'needs-review': 0, 'approved': 0, 'rejected': 0, 'auto-passed': 0 };

  requirements.forEach(r => {
    const col = cardState[r.id];
    counts[col]++;
    const cardEl = createCard(r, col);
    columns[col].appendChild(cardEl);
  });

  // Update counts
  Object.keys(counts).forEach(key => {
    document.getElementById('count-' + key).textContent = counts[key];
  });

  // Add empty states
  Object.keys(columns).forEach(key => {
    if (counts[key] === 0) {
      const empty = document.createElement('div');
      empty.className = 'column-empty';
      if (key === 'approved') empty.textContent = 'No approved items yet';
      else if (key === 'rejected') empty.textContent = 'No rejected items yet';
      else if (key === 'needs-review') empty.textContent = 'All items reviewed';
      else empty.textContent = 'No auto-passed items';
      columns[key].appendChild(empty);
    }
  });

  updateProgress();
}

function createCard(req, currentColumn) {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-id', req.id);

  const statusClass = req.aiStatus; // fail, flagged, pass, na
  const confClass = req.confidence.toLowerCase();

  let summaryText = req.summary;

  card.innerHTML = `
    <div class="card-top">
      <span class="status-dot ${statusClass}"></span>
      <div class="card-main">
        <div class="card-id">${req.id}</div>
        <div class="card-title">${req.title}</div>
        <div class="card-badges">
          <span class="badge badge-clause">${req.clause}</span>
          <span class="badge badge-confidence ${confClass}">${req.confidence} confidence</span>
        </div>
        <div class="card-summary">${summaryText}</div>
        <div class="card-expand-hint"><span class="chevron">&#9654;</span> Click to expand</div>
        <div class="card-detail">
          ${req.evidence ? `
          <div class="detail-section">
            <div class="detail-label">Evidence</div>
            <div class="detail-quote">${req.evidence}</div>
          </div>` : ''}
          ${req.gap ? `
          <div class="detail-section">
            <div class="detail-label">Gap Description</div>
            <div class="detail-text">${req.gap}</div>
          </div>` : ''}
          ${req.recommendation ? `
          <div class="detail-section">
            <div class="detail-label">Recommendation</div>
            <div class="detail-text">${req.recommendation}</div>
          </div>` : ''}
          <div class="card-actions">
            ${getActionButtons(currentColumn)}
          </div>
        </div>
      </div>
    </div>
  `;

  // Click to expand/collapse
  card.addEventListener('click', function(e) {
    // Don't toggle if clicking a button
    if (e.target.closest('.btn')) return;
    card.classList.toggle('expanded');
  });

  // Wire up action buttons
  const btns = card.querySelectorAll('.btn');
  btns.forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const action = btn.getAttribute('data-action');
      moveCard(req.id, action, card);
    });
  });

  return card;
}

function getActionButtons(column) {
  switch(column) {
    case 'needs-review':
      return `
        <button class="btn btn-approve" data-action="approve">Approve</button>
        <button class="btn btn-reject" data-action="reject">Reject</button>
      `;
    case 'approved':
      return `
        <button class="btn btn-move-review" data-action="move-to-review">Move to Review</button>
      `;
    case 'rejected':
      return `
        <button class="btn btn-move-review" data-action="move-to-review">Move to Review</button>
      `;
    case 'auto-passed':
      return `
        <button class="btn btn-challenge" data-action="challenge">Challenge &mdash; Move to Review</button>
      `;
    default:
      return '';
  }
}

function moveCard(reqId, action, cardEl) {
  let targetColumn;
  switch(action) {
    case 'approve':
      targetColumn = 'approved';
      break;
    case 'reject':
      targetColumn = 'rejected';
      break;
    case 'move-to-review':
      targetColumn = 'needs-review';
      break;
    case 'challenge':
      targetColumn = 'needs-review';
      break;
  }

  if (!targetColumn) return;

  // Animate out
  cardEl.classList.add('moving-out');

  setTimeout(() => {
    cardState[reqId] = targetColumn;
    renderBoard();

    // Animate in the moved card
    const newCard = document.querySelector(`.card[data-id="${reqId}"]`);
    if (newCard) {
      newCard.classList.add('moving-in');
      // Auto-expand the moved card briefly
      newCard.classList.add('expanded');
      setTimeout(() => {
        newCard.classList.remove('moving-in');
      }, 300);
    }
  }, 200);
}

function updateProgress() {
  // "reviewed" = items in approved or rejected columns
  let reviewed = 0;
  const total = requirements.length;

  requirements.forEach(r => {
    const col = cardState[r.id];
    if (col === 'approved' || col === 'rejected') {
      reviewed++;
    }
  });

  document.getElementById('reviewedCount').textContent = reviewed;
  const pct = Math.round((reviewed / total) * 100);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

// ─── Init ────────────────────────────────────────────────────────────────
renderBoard();
</script>

</body>
