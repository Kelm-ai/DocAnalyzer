<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drill-Down Report — Ramp 04</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fff;
    color: #1a1a2e;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ── */
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  /* ── Breadcrumbs ── */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .breadcrumb-item {
    cursor: pointer;
    color: #6b7280;
    text-decoration: none;
    background: none;
    border: none;
    font: inherit;
    padding: 0;
    transition: color 0.15s;
  }
  .breadcrumb-item:hover {
    color: #1a1a2e;
  }
  .breadcrumb-sep {
    color: #d1d5db;
    user-select: none;
  }
  .breadcrumb-current {
    color: #1a1a2e;
    font-weight: 600;
  }

  /* ── Header ── */
  .report-header {
    margin-bottom: 28px;
  }
  .report-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .report-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .report-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ── AI Badge ── */
  .ai-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: #92400e;
    background: #fefce8;
    border: 1px solid #fde68a;
    border-radius: 6px;
    padding: 5px 12px;
    margin-bottom: 20px;
  }
  .ai-badge-icon {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #f59e0b;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
  }

  /* ── Overall Score ── */
  .overall-score {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding: 16px 20px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
  }
  .score-ring {
    width: 56px;
    height: 56px;
    position: relative;
    flex-shrink: 0;
  }
  .score-ring svg {
    width: 56px;
    height: 56px;
    transform: rotate(-90deg);
  }
  .score-ring-bg {
    fill: none;
    stroke: #e5e7eb;
    stroke-width: 5;
  }
  .score-ring-fill {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease;
  }
  .score-ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .score-label {
    font-size: 13px;
    color: #6b7280;
  }
  .score-label strong {
    display: block;
    font-size: 15px;
    color: #1a1a2e;
    font-weight: 600;
  }

  /* ── Stats Row ── */
  .stats-row {
    display: flex;
    gap: 0;
    margin-bottom: 32px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
  }
  .stat-item {
    flex: 1;
    text-align: center;
    padding: 14px 8px;
    border-right: 1px solid #e5e7eb;
  }
  .stat-item:last-child { border-right: none; }
  .stat-num {
    font-size: 22px;
    font-weight: 700;
  }
  .stat-label {
    font-size: 12px;
    color: #6b7280;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .stat-fail .stat-num { color: #dc2626; }
  .stat-flagged .stat-num { color: #f59e0b; }
  .stat-pass .stat-num { color: #16a34a; }
  .stat-na .stat-num { color: #9ca3af; }

  /* ── Section Labels ── */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #9ca3af;
    margin-bottom: 12px;
  }

  /* ── Clause Cards (Level 1) ── */
  .clause-cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .clause-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    border-left: 4px solid #e5e7eb;
    cursor: pointer;
    transition: all 0.15s;
    background: #fff;
  }
  .clause-card:hover {
    border-color: #d1d5db;
    background: #f9fafb;
  }
  .clause-card.status-pass   { border-left-color: #16a34a; }
  .clause-card.status-fail   { border-left-color: #dc2626; }
  .clause-card.status-flagged { border-left-color: #f59e0b; }
  .clause-card.status-na     { border-left-color: #9ca3af; }

  .clause-card-main {
    flex: 1;
    min-width: 0;
  }
  .clause-card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .clause-card-summary {
    font-size: 13px;
    color: #6b7280;
  }

  .clause-card-right {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .clause-progress {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .clause-progress-bar {
    width: 64px;
    height: 6px;
    background: #e5e7eb;
    border-radius: 3px;
    overflow: hidden;
  }
  .clause-progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
  .clause-progress-fill.all-pass { background: #16a34a; }
  .clause-progress-fill.some-pass { background: #f59e0b; }
  .clause-progress-fill.none-pass { background: #dc2626; }
  .clause-progress-text {
    font-size: 13px;
    font-weight: 600;
    color: #6b7280;
    white-space: nowrap;
  }

  .clause-status-dots {
    display: flex;
    gap: 4px;
  }
  .mini-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .mini-dot.pass    { background: #16a34a; }
  .mini-dot.fail    { background: #dc2626; }
  .mini-dot.flagged { background: #f59e0b; }
  .mini-dot.na      { background: #d1d5db; }

  .clause-arrow {
    color: #d1d5db;
    font-size: 16px;
    transition: color 0.15s;
  }
  .clause-card:hover .clause-arrow { color: #9ca3af; }

  /* ── Level 2: Clause Detail ── */
  .clause-detail-header {
    margin-bottom: 24px;
  }
  .clause-detail-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .clause-detail-desc {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.6;
  }

  .requirements-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .requirement-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fff;
  }
  .requirement-row:hover {
    border-color: #d1d5db;
    background: #f9fafb;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
  }
  .status-dot.pass    { background: #16a34a; }
  .status-dot.fail    { background: #dc2626; }
  .status-dot.flagged { background: #f59e0b; }
  .status-dot.na      { background: #d1d5db; }

  .req-main {
    flex: 1;
    min-width: 0;
  }
  .req-id-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
    flex-wrap: wrap;
  }
  .req-id {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a2e;
    font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  .req-title {
    font-size: 14px;
    font-weight: 500;
    color: #1a1a2e;
  }
  .req-summary {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.5;
  }

  .req-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  /* ── Confidence Badge ── */
  .confidence-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .confidence-badge.high {
    background: #f0fdf4;
    color: #15803d;
    border: 1px solid #bbf7d0;
  }
  .confidence-badge.medium {
    background: #fefce8;
    color: #a16207;
    border: 1px solid #fde68a;
  }
  .confidence-badge.low {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
  }

  .row-arrow {
    color: #d1d5db;
    font-size: 14px;
  }
  .requirement-row:hover .row-arrow { color: #9ca3af; }

  /* ── Level 3: Requirement Detail ── */
  .req-detail-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .req-detail-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .req-detail-id {
    font-size: 13px;
    font-weight: 500;
    color: #6b7280;
    font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .status-badge.pass {
    background: #f0fdf4;
    color: #15803d;
    border: 1px solid #bbf7d0;
  }
  .status-badge.fail {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
  }
  .status-badge.flagged {
    background: #fefce8;
    color: #a16207;
    border: 1px solid #fde68a;
  }
  .status-badge.na {
    background: #f3f4f6;
    color: #6b7280;
    border: 1px solid #e5e7eb;
  }
  .status-badge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .status-badge.pass .status-badge-dot    { background: #16a34a; }
  .status-badge.fail .status-badge-dot    { background: #dc2626; }
  .status-badge.flagged .status-badge-dot { background: #f59e0b; }
  .status-badge.na .status-badge-dot      { background: #9ca3af; }

  /* ── Detail Sections ── */
  .detail-section {
    margin-bottom: 24px;
  }
  .detail-section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #9ca3af;
    margin-bottom: 8px;
  }

  .confidence-detail {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
  }
  .confidence-meter {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .confidence-bar {
    width: 4px;
    height: 18px;
    border-radius: 2px;
    background: #e5e7eb;
  }
  .confidence-bar.active.high   { background: #16a34a; }
  .confidence-bar.active.medium { background: #f59e0b; }
  .confidence-bar.active.low    { background: #dc2626; }
  .confidence-text {
    font-size: 13px;
    color: #6b7280;
  }
  .confidence-text strong {
    color: #1a1a2e;
  }

  .evidence-block {
    padding: 14px 16px;
    border-left: 3px solid #e5e7eb;
    background: #f9fafb;
    border-radius: 0 8px 8px 0;
    margin-bottom: 8px;
  }
  .evidence-text {
    font-size: 14px;
    color: #374151;
    line-height: 1.6;
    font-style: italic;
  }
  .evidence-ref {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 6px;
    font-style: normal;
  }

  .gap-list, .rec-list {
    list-style: none;
  }
  .gap-list li, .rec-list li {
    position: relative;
    padding: 8px 0 8px 20px;
    font-size: 14px;
    color: #374151;
    border-bottom: 1px solid #f3f4f6;
    line-height: 1.5;
  }
  .gap-list li:last-child, .rec-list li:last-child {
    border-bottom: none;
  }
  .gap-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 14px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fecaca;
    border: 2px solid #dc2626;
  }
  .rec-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 14px;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: #dbeafe;
    border: 2px solid #3b82f6;
  }

  /* ── Review Actions ── */
  .review-actions {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 20px;
    background: #f9fafb;
  }
  .review-actions-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .review-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .review-btn {
    padding: 8px 18px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: #fff;
    color: #1a1a2e;
    transition: all 0.15s;
    font-family: inherit;
  }
  .review-btn:hover {
    border-color: #d1d5db;
    background: #f3f4f6;
  }
  .review-btn.approve {
    background: #f0fdf4;
    border-color: #bbf7d0;
    color: #15803d;
  }
  .review-btn.approve:hover {
    background: #dcfce7;
  }
  .review-btn.reject {
    background: #fef2f2;
    border-color: #fecaca;
    color: #dc2626;
  }
  .review-btn.reject:hover {
    background: #fee2e2;
  }
  .review-btn.flag {
    background: #fefce8;
    border-color: #fde68a;
    color: #a16207;
  }
  .review-btn.flag:hover {
    background: #fef9c3;
  }
  .review-btn.active {
    box-shadow: 0 0 0 2px rgba(26, 26, 46, 0.15);
    font-weight: 600;
  }

  .review-textarea {
    width: 100%;
    min-height: 80px;
    padding: 10px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    color: #1a1a2e;
    line-height: 1.5;
  }
  .review-textarea::placeholder {
    color: #9ca3af;
  }
  .review-textarea:focus {
    outline: none;
    border-color: #9ca3af;
    box-shadow: 0 0 0 2px rgba(26, 26, 46, 0.08);
  }

  /* ── Navigation Buttons ── */
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid #e5e7eb;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: #fff;
    color: #1a1a2e;
    transition: all 0.15s;
    font-family: inherit;
  }
  .nav-btn:hover {
    background: #f9fafb;
    border-color: #d1d5db;
  }
  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .nav-btn:disabled:hover {
    background: #fff;
    border-color: #e5e7eb;
  }

  /* ── View Transitions ── */
  .view {
    display: none;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .view.active {
    display: block;
  }
  .view.visible {
    opacity: 1;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: #e5e7eb;
    margin: 24px 0;
  }

  /* ── Back link ── */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: #6b7280;
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    padding: 4px 0;
    margin-bottom: 16px;
    transition: color 0.15s;
  }
  .back-link:hover {
    color: #1a1a2e;
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .clause-card {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .clause-card-right {
      width: 100%;
      justify-content: space-between;
    }
    .stats-row {
      flex-wrap: wrap;
    }
    .stat-item {
      flex: 1 1 50%;
      border-bottom: 1px solid #e5e7eb;
    }
    .stat-item:nth-child(2) { border-right: none; }
    .stat-item:nth-last-child(-n+2) { border-bottom: none; }
    .req-detail-header {
      flex-direction: column;
    }
    .nav-buttons {
      flex-direction: column;
      gap: 8px;
    }
    .nav-btn { justify-content: center; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- ═══════════════════════════════════════════════════
       LEVEL 1: SUMMARY VIEW
       ═══════════════════════════════════════════════════ -->
  <div id="level1" class="view active visible">
    <nav class="breadcrumb">
      <span class="breadcrumb-current">Report</span>
    </nav>

    <div class="report-header">
      <div class="report-title">ISO 27001 Compliance Evaluation</div>
      <div class="report-meta">
        <span>Information_Security_Policy_v3.1.pdf</span>
        <span>ISO 27001:2022</span>
        <span>Nov 9, 2024</span>
      </div>
      <div class="ai-badge">
        <span class="ai-badge-icon">!</span>
        AI Assessment &mdash; Human verification required
      </div>
    </div>

    <div class="overall-score">
      <div class="score-ring">
        <svg viewBox="0 0 56 56">
          <circle class="score-ring-bg" cx="28" cy="28" r="23"></circle>
          <circle class="score-ring-fill" cx="28" cy="28" r="23"
                  stroke="#f59e0b"
                  stroke-dasharray="144.51"
                  stroke-dashoffset="67.5"></circle>
        </svg>
        <div class="score-ring-text">53%</div>
      </div>
      <div class="score-label">
        <strong>8 of 15 requirements passed</strong>
        Overall compliance score across 5 clauses
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-item stat-fail">
        <div class="stat-num">3</div>
        <div class="stat-label">Failures</div>
      </div>
      <div class="stat-item stat-flagged">
        <div class="stat-num">3</div>
        <div class="stat-label">Flagged</div>
      </div>
      <div class="stat-item stat-pass">
        <div class="stat-num">8</div>
        <div class="stat-label">Passed</div>
      </div>
      <div class="stat-item stat-na">
        <div class="stat-num">1</div>
        <div class="stat-label">N/A</div>
      </div>
    </div>

    <div class="section-label">Clauses</div>
    <div class="clause-cards" id="clauseCards">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════
       LEVEL 2: CLAUSE DETAIL VIEW
       ═══════════════════════════════════════════════════ -->
  <div id="level2" class="view">
    <nav class="breadcrumb">
      <button class="breadcrumb-item" onclick="navigateTo(1)">Report</button>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current" id="l2BreadcrumbCurrent"></span>
    </nav>

    <div class="clause-detail-header">
      <div class="clause-detail-title" id="l2Title"></div>
      <div class="clause-detail-desc" id="l2Desc"></div>
    </div>

    <div class="section-label">Requirements</div>
    <div class="requirements-list" id="requirementsList">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════
       LEVEL 3: REQUIREMENT DETAIL VIEW

// ────────────────────────────────────────────────
// NAVIGATION
// ────────────────────────────────────────────────
function navigateTo(level, data) {
  const views = document.querySelectorAll('.view');

  // Fade out current view
  views.forEach(v => {
    if (v.classList.contains('active')) {
      v.classList.remove('visible');
    }
  });

  setTimeout(() => {
    views.forEach(v => v.classList.remove('active'));

    if (level === 1) {
      currentLevel = 1;
      currentClauseId = null;
      document.getElementById('level1').classList.add('active');
    } else if (level === 2) {
      currentLevel = 2;
      currentClauseId = data;
      renderClauseDetail(data);
      document.getElementById('level2').classList.add('active');
    } else if (level === 3) {
      currentLevel = 3;
      currentReqIndex = data;
      renderRequirementDetail(data);
      document.getElementById('level3').classList.add('active');
    }

    // Fade in after a tick
    requestAnimationFrame(() => {
      document.querySelector('.view.active').classList.add('visible');
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 150);
}

function navigateBackToClause() {
  const req = allRequirements[currentReqIndex];
  navigateTo(2, req.clauseId);
}

function navigateReq(direction) {
  const newIndex = currentReqIndex + direction;
  if (newIndex >= 0 && newIndex < allRequirements.length) {
    navigateTo(3, newIndex);
  }
}

// RENDER: Level 1 — Clause Cards
// ────────────────────────────────────────────────
function renderClauseCards() {
  const container = document.getElementById('clauseCards');
  container.innerHTML = '';

  clauses.forEach(clause => {
    const passCount = clause.requirements.filter(r => r.status === 'pass').length;
    const failCount = clause.requirements.filter(r => r.status === 'fail').length;
    const flaggedCount = clause.requirements.filter(r => r.status === 'flagged').length;
    const naCount = clause.requirements.filter(r => r.status === 'na').length;
    const total = clause.requirements.length;
    const evalTotal = total - naCount;

    // Worst status determines border color
    let worstStatus = 'pass';
    if (failCount > 0) worstStatus = 'fail';
    else if (flaggedCount > 0) worstStatus = 'flagged';
    else if (naCount === total) worstStatus = 'na';

    // Progress
    const progressPct = evalTotal > 0 ? (passCount / evalTotal) * 100 : 0;
    let progressClass = 'all-pass';
    if (progressPct === 0 && evalTotal > 0) progressClass = 'none-pass';
    else if (progressPct < 100) progressClass = 'some-pass';

    // Summary text
    const parts = [];
    if (failCount > 0) parts.push(failCount + ' fail');
    if (flaggedCount > 0) parts.push(flaggedCount + ' flagged');
    if (passCount > 0) parts.push(passCount + ' pass');
    if (naCount > 0) parts.push(naCount + ' N/A');

    const card = document.createElement('div');
    card.className = 'clause-card status-' + worstStatus;
    card.onclick = () => navigateTo(2, clause.id);

    card.innerHTML = `
      <div class="clause-card-main">
        <div class="clause-card-title">Clause ${clause.num}: ${clause.name}</div>
        <div class="clause-card-summary">${parts.join(' &middot; ')}</div>
      </div>
      <div class="clause-card-right">
        <div class="clause-progress">
          <div class="clause-progress-bar">
            <div class="clause-progress-fill ${progressClass}" style="width: ${progressPct}%"></div>
          </div>
          <span class="clause-progress-text">${passCount}/${evalTotal > 0 ? evalTotal : total} passed</span>
        </div>
        <div class="clause-status-dots">
          ${clause.requirements.map(r => '<span class="mini-dot ' + r.status + '"></span>').join('')}
        </div>
        <span class="clause-arrow">&rsaquo;</span>
      </div>
    `;

    container.appendChild(card);
  });
}

function renderClauseDetail(clauseId) {
  const clause = clauses.find(c => c.id === clauseId);
  if (!clause) return;

  document.getElementById('l2BreadcrumbCurrent').textContent = 'Clause ' + clause.num + ': ' + clause.name;
  document.getElementById('l2Title').textContent = 'Clause ' + clause.num + ': ' + clause.name;
  document.getElementById('l2Desc').textContent = clause.description;

  const list = document.getElementById('requirementsList');
  list.innerHTML = '';

  clause.requirements.forEach(req => {
    const globalIndex = allRequirements.findIndex(r => r.id === req.id);

    const statusLabels = { pass: 'Pass', fail: 'Fail', flagged: 'Flagged', na: 'N/A' };
    const confidenceLabels = { high: 'High', medium: 'Medium', low: 'Low' };

    const row = document.createElement('div');
    row.className = 'requirement-row';
    row.onclick = () => navigateTo(3, globalIndex);

    row.innerHTML = `
      <span class="status-dot ${req.status}"></span>
      <div class="req-main">
        <div class="req-id-title">
          <span class="req-id">${req.id}</span>
          <span class="req-title">${req.title}</span>
        </div>
        <div class="req-summary">${req.summary}</div>
      </div>
      <div class="req-right">
        <span class="confidence-badge ${req.confidence}">${confidenceLabels[req.confidence]} confidence</span>
        <span class="row-arrow">&rsaquo;</span>
      </div>
    `;

    list.appendChild(row);
  });
}

      <div class="confidence-detail">
        <div class="confidence-meter">
          ${confidenceBarsHTML}
        </div>
        <div class="confidence-text">
          <strong>${confidenceLabels[req.confidence]} (${req.confidenceScore}%)</strong><br>
          ${confidenceExplanations[req.confidence]}
        </div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Evidence</div>
      ${evidenceHTML}
    </div>

    ${gapsHTML}
    ${recsHTML}

    <div class="divider"></div>

    <div class="review-actions">
      <div class="review-actions-title">Reviewer Actions</div>
      <div class="review-buttons">
        <button class="review-btn approve" onclick="selectReviewAction(this, 'approve')">Approve</button>
        <button class="review-btn reject" onclick="selectReviewAction(this, 'reject')">Reject</button>
        <button class="review-btn flag" onclick="selectReviewAction(this, 'flag')">Flag for Review</button>
      </div>
      <textarea class="review-textarea" placeholder="Add a comment or note for this requirement..."></textarea>
    </div>
  `;
}

// ────────────────────────────────────────────────
// REVIEW ACTION BUTTONS
// ────────────────────────────────────────────────
function selectReviewAction(btn, action) {
  const buttons = btn.parentElement.querySelectorAll('.review-btn');
  buttons.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
renderClauseCards();
</script>

</body>
</html>
