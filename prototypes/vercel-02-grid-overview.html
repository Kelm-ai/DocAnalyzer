<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Overview — ISO 27001 Compliance Report</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
    background: #fff;
    color: #000;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }

  /* ── Header ── */
  .header {
    padding: 48px 48px 0;
    max-width: 1400px;
    margin: 0 auto;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
    color: #000;
  }

  .header-meta {
    margin-top: 8px;
    font-size: 14px;
    color: #888;
    letter-spacing: 0;
  }

  .header-ai-notice {
    margin-top: 6px;
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── Filter Bar ── */
  .filter-bar {
    padding: 24px 48px;
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-pill {
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid #000;
    border-radius: 999px;
    background: #fff;
    color: #000;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    user-select: none;
    white-space: nowrap;
  }

  .filter-pill:hover {
    background: #f5f5f5;
  }

  .filter-pill.active {
    background: #000;
    color: #fff;
  }

  .filter-pill.active:hover {
    background: #222;
  }

  /* ── Grid ── */
  .grid-container {
    padding: 0 48px 64px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }

  @media (max-width: 1200px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .header, .filter-bar, .grid-container { padding-left: 24px; padding-right: 24px; }
  }
  @media (max-width: 680px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .header { padding-top: 32px; }
    .header h1 { font-size: 22px; }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* ── Cell / Card ── */
  .cell {
    position: relative;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 20px 18px 16px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    min-height: 140px;
  }

  .cell:hover {
    border-color: #000;
  }

  .cell:active {
    background: #fafafa;
  }

  /* Status indicator — top right */
  .cell-status {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cell-status svg {
    display: block;
  }

  .cell-req-id {
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    color: #888;
    margin-bottom: 6px;
  }

  .cell-title {
    font-size: 14px;
    font-weight: 600;
    color: #000;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .cell-footer {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .cell-clause {
    font-size: 11px;
    color: #888;
  }

  .cell-confidence {
    font-size: 11px;
    color: #aaa;
    text-transform: lowercase;
  }

  /* ── Overlay / Modal ── */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.97);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .overlay-inner {
    width: 100%;
    max-width: 640px;
    padding: 64px 24px 80px;
    transform: translateY(12px);
    transition: transform 0.25s ease;
  }

  .overlay.open .overlay-inner {
    transform: translateY(0);
  }

  .overlay-close {
    position: fixed;
    top: 24px;
    right: 32px;
    z-index: 1001;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #000;
    background: none;
    border: 1px solid #eee;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .overlay-close:hover {
    border-color: #000;
  }

  .overlay-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .overlay-status-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 16px;
  }

  .badge-fail {
    background: #000;
    color: #fff;
  }

  .badge-flagged {
    background: #f5f5f5;
    color: #000;
    border: 1px solid #ccc;
  }

  .badge-pass {
    background: #f5f5f5;
    color: #555;
  }

  .badge-na {
    background: #fafafa;
    color: #aaa;
    border: 1px solid #eee;
  }

  .overlay-meta {
    font-size: 13px;
    color: #888;
    margin-bottom: 32px;
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
  }

  .overlay-section {
    margin-bottom: 28px;
  }

  .overlay-section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
    margin-bottom: 8px;
  }

  .overlay-evidence {
    border-left: 2px solid #eee;
    padding-left: 16px;
    font-size: 14px;
    color: #333;
    line-height: 1.7;
  }

  .overlay-text {
    font-size: 14px;
    color: #333;
    line-height: 1.7;
  }

  /* Review section */
  .review-section {
    margin-top: 36px;
    padding-top: 28px;
    border-top: 1px solid #eee;
  }

  .review-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .review-btn {
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid #000;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fff;
    color: #000;
  }

  .review-btn:hover {
    background: #000;
    color: #fff;
  }

  .review-btn.selected-approve {
    background: #000;
    color: #fff;
  }

  .review-btn.selected-reject {
    background: #000;
    color: #fff;
  }

  .review-comment {
    width: 100%;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
    outline: none;
    transition: border-color 0.15s;
    color: #000;
  }

  .review-comment::placeholder {
    color: #ccc;
  }

  .review-comment:focus {
    border-color: #000;
  }

  .review-status-text {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
  }

  /* Navigation */
  .overlay-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid #eee;
  }

  .nav-btn {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid #eee;
    border-radius: 6px;
    background: #fff;
    color: #000;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .nav-btn:hover {
    border-color: #000;
  }

  .nav-btn:disabled {
    color: #ccc;
    border-color: #eee;
    cursor: default;
  }

  .overlay-ai-notice {
    margin-top: 28px;
    font-size: 11px;
    color: #bbb;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: center;
  }

  /* Animations */
  .cell {
    animation: cellIn 0.3s ease both;
  }

  @keyframes cellIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Scrollbar */
  .overlay::-webkit-scrollbar {
    width: 6px;
  }
  .overlay::-webkit-scrollbar-thumb {
    background: #ddd;
    border-radius: 3px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Information Security Management Policy v3.2</h1>
  <div class="header-meta">ISO 27001:2022 &middot; 73% &middot; Jan 15, 2024</div>
  <div class="header-ai-notice">ai assessment &mdash; human verification required</div>
</div>

<div class="filter-bar" id="filterBar"></div>

<div class="grid-container">
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <button class="overlay-close" id="overlayClose" aria-label="Close">&times;</button>
  <div class="overlay-inner" id="overlayInner"></div>
</div>

<script>

const requirements = [

    evidence: "Training records exist for 80% of security team members showing relevant certifications (CISSP, CISM, ISO 27001 Lead Auditor). However, competence evaluations for non-security staff in security-critical roles (system administrators, database administrators, DevOps engineers) are incomplete. Only 3 of 8 department heads have completed the required ISMS awareness assessment.",

// ── State ──
let activeFilter = "all";
let filteredIds = [];
let openIndex = -1; // index into filteredIds

// ── Helpers ──
function statusLabel(s) {
  return { pass: "Passed", fail: "Failed", flagged: "Flagged", na: "N/A" }[s] || s;
}

function badgeClass(s) {
  return { pass: "badge-pass", fail: "badge-fail", flagged: "badge-flagged", na: "badge-na" }[s] || "";
}

function statusIcon(s) {
  if (s === "fail") {
    return '<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#000"/></svg>';
  }
  if (s === "flagged") {
    return '<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#000" stroke-width="1.5"/><path d="M7 1.5A5.5 5.5 0 0 1 12.5 7H7Z" fill="#000"/></svg>';
  }
  if (s === "pass") {
    return '<svg width="14" height="14" viewBox="0 0 14 14"><polyline points="3,7.5 6,10.5 11,4" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  if (s === "na") {
    return '<svg width="14" height="14" viewBox="0 0 14 14"><line x1="4" y1="7" x2="10" y2="7" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/></svg>';
  }
  return "";
}

// ── Render filters ──
function renderFilters() {
  const counts = { all: 0, fail: 0, flagged: 0, pass: 0, na: 0 };
  requirements.forEach(r => { counts.all++; counts[r.status]++; });

  const labels = [
    ["all", `All ${counts.all}`],
    ["fail", `Failed ${counts.fail}`],
    ["flagged", `Flagged ${counts.flagged}`],
    ["pass", `Passed ${counts.pass}`],
    ["na", `N/A ${counts.na}`]
  ];

  const bar = document.getElementById("filterBar");
  bar.innerHTML = "";
  labels.forEach(([key, label]) => {
    const pill = document.createElement("button");
    pill.className = "filter-pill" + (activeFilter === key ? " active" : "");
    pill.textContent = label;
    pill.addEventListener("click", () => {
      activeFilter = key;
      renderFilters();
      renderGrid();
    });
    bar.appendChild(pill);
  });
}

// ── Render grid ──
function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const filtered = requirements.filter(r => activeFilter === "all" || r.status === activeFilter);
  filteredIds = filtered.map(r => r.id);

  filtered.forEach((r, i) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.animationDelay = (i * 0.03) + "s";
    cell.innerHTML = `
      <div class="cell-status">${statusIcon(r.status)}</div>
      <div class="cell-req-id">${r.id}</div>
      <div class="cell-title">${r.title}</div>
      <div class="cell-footer">
        <span class="cell-clause">Clause ${r.clause}</span>
        <span class="cell-confidence">${r.confidence}</span>
      </div>
    `;
    cell.addEventListener("click", () => openOverlay(r.id));
    grid.appendChild(cell);
  });
}

// ── Overlay ──
function openOverlay(reqId) {
  const idx = filteredIds.indexOf(reqId);
  if (idx === -1) return;
  openIndex = idx;
  renderOverlay();
  const overlay = document.getElementById("overlay");
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
  overlay.scrollTop = 0;
}

function closeOverlay() {
  const overlay = document.getElementById("overlay");
  overlay.classList.remove("open");
  document.body.style.overflow = "";
  openIndex = -1;
}

function navigateOverlay(dir) {
  const next = openIndex + dir;
  if (next < 0 || next >= filteredIds.length) return;
  openIndex = next;
  renderOverlay();
  document.getElementById("overlay").scrollTop = 0;
}

function renderOverlay() {
  const reqId = filteredIds[openIndex];
  const r = requirements.find(req => req.id === reqId);
  if (!r) return;

  const inner = document.getElementById("overlayInner");

  let html = `
    <div class="overlay-title">${r.title}</div>
    <span class="overlay-status-badge ${badgeClass(r.status)}">${statusLabel(r.status)}</span>
    <div class="overlay-meta">${r.id} &middot; Clause ${r.clause} &middot; ${r.confidence} confidence</div>

    <div class="overlay-section">
      <div class="overlay-section-label">Evidence</div>
      <div class="overlay-evidence">${r.evidence}</div>
    </div>
  `;

  if (r.gap) {
    html += `
    <div class="overlay-section">
      <div class="overlay-section-label">Gap</div>
      <div class="overlay-text">${r.gap}</div>
    </div>`;
  }

  if (r.recommendation) {
    html += `
    <div class="overlay-section">
      <div class="overlay-section-label">Recommendation</div>
      <div class="overlay-text">${r.recommendation}</div>
    </div>`;
  }

  // Review section
  const reviewState = r.review; // null, 'approved', 'rejected'
  html += `
    <div class="review-section">
      <div class="overlay-section-label">Review</div>
      <div class="review-buttons">
        <button class="review-btn ${reviewState === 'approved' ? 'selected-approve' : ''}" onclick="setReview('${r.id}', 'approved')">approve</button>
        <button class="review-btn ${reviewState === 'rejected' ? 'selected-reject' : ''}" onclick="setReview('${r.id}', 'rejected')">reject</button>
      </div>
      <textarea class="review-comment" placeholder="Optional comment…" oninput="setComment('${r.id}', this.value)">${r.comment || ''}</textarea>
      ${reviewState ? `<div class="review-status-text">${reviewState === 'approved' ? 'Approved' : 'Rejected'} by reviewer</div>` : ''}
    </div>
  `;

  // Navigation
  html += `
    <div class="overlay-nav">
      <button class="nav-btn" onclick="navigateOverlay(-1)" ${openIndex === 0 ? 'disabled' : ''}>&larr; prev</button>
      <span style="font-size:12px;color:#aaa;">${openIndex + 1} / ${filteredIds.length}</span>
      <button class="nav-btn" onclick="navigateOverlay(1)" ${openIndex === filteredIds.length - 1 ? 'disabled' : ''}>next &rarr;</button>
    </div>
    <div class="overlay-ai-notice">ai assessment &mdash; verify before use</div>
  `;

  inner.innerHTML = html;
}

function setReview(reqId, state) {
  const r = requirements.find(req => req.id === reqId);
  if (!r) return;
  r.review = r.review === state ? null : state; // toggle
  renderOverlay();
}

function setComment(reqId, value) {
  const r = requirements.find(req => req.id === reqId);
  if (r) r.comment = value;
}

// ── Event listeners ──
document.getElementById("overlayClose").addEventListener("click", closeOverlay);
document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target === document.getElementById("overlay")) closeOverlay();
});
document.addEventListener("keydown", (e) => {
  if (openIndex === -1) return;
  if (e.key === "Escape") closeOverlay();
  if (e.key === "ArrowLeft") navigateOverlay(-1);
  if (e.key === "ArrowRight") navigateOverlay(1);
});

// ── Init ──
renderFilters();
renderGrid();
</script>
</body>
</html>
