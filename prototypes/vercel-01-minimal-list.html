<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal List — Compliance Report</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
    color: #000;
    background: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* Header */
  .header-title {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.3px;
    line-height: 1.3;
  }

  .header-meta {
    margin-top: 6px;
    font-size: 14px;
    color: #888;
    line-height: 1.5;
  }

  .header-meta span + span::before {
    content: "\00b7";
    margin: 0 8px;
  }

  .divider {
    border: none;
    border-top: 1px solid #eee;
    margin: 20px 0;
  }

  /* Status summary */
  .status-summary {
    font-size: 14px;
    color: #888;
    line-height: 1.5;
  }

  .status-summary .fail-count {
    color: #000;
    font-weight: 600;
  }

  .status-summary .sep {
    margin: 0 6px;
  }

  /* Notice */
  .notice {
    margin-top: 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #aaa;
  }

  /* Filter row */
  .filters {
    margin-top: 28px;
    display: flex;
    gap: 20px;
  }

  .filters button {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 14px;
    color: #888;
    cursor: pointer;
    padding: 0;
    text-decoration: none;
    line-height: 1.5;
    transition: color 0.15s;
  }

  .filters button:hover {
    color: #000;
  }

  .filters button.active {
    color: #000;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Requirements list */
  .req-list {
    margin-top: 24px;
  }

  .req-row {
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    transition: background 0.1s;
  }

  .req-row:hover {
    background: #fafafa;
  }

  .req-header {
    display: flex;
    align-items: center;
    padding: 12px 0;
    gap: 12px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-dot.fail { background: #000; }
  .status-dot.flagged { background: #999; }
  .status-dot.pass { background: #ccc; }
  .status-dot.na { background: #e5e5e5; }

  .req-id {
    font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    color: #888;
    flex-shrink: 0;
    min-width: 78px;
  }

  .req-title {
    font-size: 15px;
    color: #000;
    flex: 1;
    line-height: 1.4;
  }

  .req-confidence {
    font-size: 13px;
    color: #888;
    flex-shrink: 0;
    text-align: right;
  }

  /* Expanded detail */
  .req-detail {
    display: none;
    padding: 4px 0 20px 18px;
    font-size: 14px;
    line-height: 1.7;
    color: #000;
  }

  .req-row.expanded .req-detail {
    display: block;
  }

  .evidence-quote {
    font-style: italic;
    border-left: 2px solid #ddd;
    padding-left: 14px;
    margin: 8px 0 12px;
    color: #444;
  }

  .detail-label {
    font-weight: 600;
  }

  .detail-line {
    margin-top: 8px;
  }

  .confidence-note {
    margin-top: 12px;
    color: #888;
    font-size: 13px;
  }

  .review-actions {
    margin-top: 14px;
    display: flex;
    gap: 16px;
  }

  .review-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: #888;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
    transition: color 0.15s;
  }

  .review-btn:hover {
    color: #000;
  }

  .review-btn.selected {
    color: #000;
    font-weight: 600;
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #eee;
    font-size: 14px;
    color: #888;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .export-link {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: #888;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
    transition: color 0.15s;
  }

  .export-link:hover {
    color: #000;
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-title">ISMS Policy Document v2.1</div>
    <div class="header-meta">
      <span>ISO 27001:2022</span>
      <span>2025-01-15</span>
      <span>73% compliant</span>
    </div>
  </div>

  <hr class="divider">

  <!-- Status summary -->
  <div class="status-summary">
    <span class="fail-count">3 failed</span><span class="sep">&middot;</span><span>3 flagged</span><span class="sep">&middot;</span><span>8 passed</span><span class="sep">&middot;</span><span>1 n/a</span>
  </div>

  <!-- Notice -->
  <div class="notice">ai assessment &mdash; human verification required</div>

  <!-- Filters -->
  <div class="filters">
    <button class="active" data-filter="all">all</button>
    <button data-filter="fail">failed</button>
    <button data-filter="flagged">flagged</button>
    <button data-filter="pass">passed</button>
    <button data-filter="na">n/a</button>
  </div>

  <!-- Requirements list -->
  <div class="req-list" id="reqList"></div>

  <!-- Footer -->
  <div class="footer">
    <span id="footerText">15 requirements &middot; 0 reviewed</span>
    <button class="export-link" id="exportBtn">export</button>
  </div>

</div>

<script>
(function() {

  var requirements = [
    {
      id: "REQ-6.1.2",
      title: "Risk Assessment Process",
      clause: "Clause 6.1",
      status: "fail",
      confidence: "medium",
      evidence: "The organization shall ensure information security risks are managed appropriately (Section 4.2)",
      gap: "No documented risk assessment methodology found. The policy references risk management in general terms but lacks a specific, repeatable process for identifying, analyzing, and evaluating information security risks.",
      recommendation: "Develop and document a formal risk assessment methodology including criteria for risk acceptance and assessment frequency."
    },
    {
      id: "REQ-8.1.1",
      title: "Operational Planning and Control",
      clause: "Clause 8.1",
      status: "fail",
      confidence: "high",
      evidence: "Security controls shall be implemented as deemed necessary by management (Section 7.1)",
      gap: "Missing documented operational procedures for security controls.",
      recommendation: "Create detailed operational procedures for each security control."
    },
    {
      id: "REQ-6.2.1",
      title: "Information Security Objectives",
      clause: "Clause 6.2",
      status: "fail",
      confidence: "high",
      evidence: "The organization is committed to maintaining a high level of information security (Section 1.3)",
      gap: "No measurable information security objectives defined.",
      recommendation: "Define SMART information security objectives."
    },
    {
      id: "REQ-7.2.1",
      title: "Competence Requirements",
      clause: "Clause 7.2",
      status: "flagged",
      confidence: "low",
      evidence: "Staff shall receive appropriate information security training upon joining and annually thereafter (Section 5.4)",
      gap: "Partial competence framework found but missing evidence of implementation.",
      recommendation: "Implement a competence tracking system."
    },
    {
      id: "REQ-9.1.1",
      title: "Monitoring and Measurement",
      clause: "Clause 9.1",
      status: "flagged",
      confidence: "medium",
      evidence: "Information security performance shall be monitored and reported to management (Section 8.2)",
      gap: "Monitoring requirements mentioned but no specific metrics or KPIs defined.",
      recommendation: "Define specific security metrics and KPIs."
    },
    {
      id: "REQ-9.3.1",
      title: "Management Review Inputs",
      clause: "Clause 9.3",
      status: "flagged",
      confidence: "medium",
      evidence: "Management shall review the ISMS at planned intervals (Section 9.1)",
      gap: "Management review process exists but input requirements are incomplete.",
      recommendation: "Update management review procedure to include all required inputs."
    },
    {
      id: "REQ-5.1.1",
      title: "Leadership Commitment",
      clause: "Clause 5.1",
      status: "pass",
      confidence: "high",
      evidence: "The Board of Directors and Senior Management are committed to supporting information security (Section 2.1)",
      gap: null,
      recommendation: null
    },
    {
      id: "REQ-5.2.1",
      title: "Information Security Policy",
      clause: "Clause 5.2",
      status: "pass",
      confidence: "high",
      evidence: "This Information Security Policy establishes the framework for managing information security risks (Section 1.1)",
      gap: null,
      recommendation: null
    },
    {
      id: "REQ-5.3.1",
      title: "Organizational Roles",
      clause: "Clause 5.3",
      status: "pass",
      confidence: "medium",
      evidence: "The CISO is responsible for the overall ISMS. Department heads implement controls (Section 3.1)",
      gap: null,
      recommendation: null
    },
    {
      id: "REQ-7.1.1",
      title: "Resources",
      clause: "Clause 7.1",
      status: "pass",
      confidence: "high",
      evidence: "The organization shall provide resources needed for the ISMS including budget allocation (Section 5.1)",
      gap: null,
      recommendation: null
    },
    {
      id: "REQ-7.3.1",
      title: "Awareness",
      clause: "Clause 7.3",
      status: "pass",
      confidence: "high",
      evidence: "All employees shall be made aware of the information security policy (Section 5.5)",
      gap: null,
      recommendation: null
    },
    {
      id: "REQ-7.4.1",
      title: "Communication",
      clause: "Clause 7.4",
      status: "pass",
      confidence: "medium",
      evidence: "Communications regarding information security shall follow the defined communication plan (Section 5.6)",
      gap: null,
      recommendation: null
    },
    {
      id: "REQ-9.2.1",
      title: "Internal Audit",
      clause: "Clause 9.2",
      status: "pass",
      confidence: "high",
      evidence: "Internal audits shall be conducted at planned intervals, at least annually (Section 8.3)",
      gap: null,
      recommendation: null
    },
    {
      id: "REQ-7.5.1",
      title: "Documented Information",
      clause: "Clause 7.5",
      status: "pass",
      confidence: "high",
      evidence: "All ISMS documentation shall be controlled, versioned, and maintained (Section 5.7)",
      gap: null,
      recommendation: null
    },
    {
      id: "REQ-8.2.1",
      title: "Risk Assessment (Separate)",
      clause: "Clause 8.2",
      status: "na",
      confidence: null,
      evidence: "Assessed under REQ-6.1.2",
      gap: null,
      recommendation: null
    }
  ];

  // Review states: keyed by requirement id
  var reviewStates = {};

  var currentFilter = "all";

  var listEl = document.getElementById("reqList");
  var footerText = document.getElementById("footerText");
  var exportBtn = document.getElementById("exportBtn");

  // Sort order
  var statusOrder = { fail: 0, flagged: 1, pass: 2, na: 3 };

  requirements.sort(function(a, b) {
    return statusOrder[a.status] - statusOrder[b.status];
  });

  function confidenceLabel(c) {
    if (!c) return "";
    return c;
  }

  function confidenceNote(req) {
    if (!req.confidence) return "";
    var desc = "";
    if (req.confidence === "high") desc = "strong evidence found";
    else if (req.confidence === "medium") desc = "partial evidence found";
    else if (req.confidence === "low") desc = "limited evidence found";
    return "confidence: " + req.confidence + " \u2014 " + desc;
  }

  function buildDetail(req) {
    var html = "";

    // Evidence
    if (req.evidence) {
      html += '<div class="evidence-quote">\u201c' + escHtml(req.evidence) + '\u201d</div>';
    }

    // Gap
    if (req.gap) {
      html += '<div class="detail-line"><span class="detail-label">gap \u2014</span> ' + escHtml(req.gap) + '</div>';
    }

    // Recommendation
    if (req.recommendation) {
      html += '<div class="detail-line"><span class="detail-label">recommendation \u2014</span> ' + escHtml(req.recommendation) + '</div>';
    }

    // Confidence note
    var cn = confidenceNote(req);
    if (cn) {
      html += '<div class="confidence-note">' + escHtml(cn) + '</div>';
    }

    // Review actions
    var state = reviewStates[req.id] || null;
    html += '<div class="review-actions">';
    html += '<button class="review-btn' + (state === "approved" ? " selected" : "") + '" data-req="' + req.id + '" data-action="approved">approve</button>';
    html += '<button class="review-btn' + (state === "rejected" ? " selected" : "") + '" data-req="' + req.id + '" data-action="rejected">reject</button>';
    html += '</div>';

    return html;
  }

  function escHtml(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function render() {
    listEl.innerHTML = "";

    var visible = requirements.filter(function(r) {
      if (currentFilter === "all") return true;
      return r.status === currentFilter;
    });

    visible.forEach(function(req) {
      var row = document.createElement("div");
      row.className = "req-row";
      row.setAttribute("data-id", req.id);

      var header = document.createElement("div");
      header.className = "req-header";

      // Status dot
      var dot = document.createElement("span");
      dot.className = "status-dot " + req.status;

      // ID
      var idEl = document.createElement("span");
      idEl.className = "req-id";
      idEl.textContent = req.id;

      // Title
      var titleEl = document.createElement("span");
      titleEl.className = "req-title";
      titleEl.textContent = req.title;

      // Confidence
      var confEl = document.createElement("span");
      confEl.className = "req-confidence";
      confEl.textContent = confidenceLabel(req.confidence);

      header.appendChild(dot);
      header.appendChild(idEl);
      header.appendChild(titleEl);
      header.appendChild(confEl);

      // Detail
      var detail = document.createElement("div");
      detail.className = "req-detail";
      detail.innerHTML = buildDetail(req);

      row.appendChild(header);
      row.appendChild(detail);

      // Click to expand/collapse
      header.addEventListener("click", function() {
        var wasExpanded = row.classList.contains("expanded");
        // Collapse all
        var allRows = listEl.querySelectorAll(".req-row.expanded");
        for (var i = 0; i < allRows.length; i++) {
          allRows[i].classList.remove("expanded");
        }
        if (!wasExpanded) {
          row.classList.add("expanded");
        }
      });

      listEl.appendChild(row);
    });

    updateFooter();
  }

  function updateFooter() {
    var reviewed = 0;
    for (var key in reviewStates) {
      if (reviewStates[key]) reviewed++;
    }
    footerText.textContent = requirements.length + " requirements \u00b7 " + reviewed + " reviewed";
  }

  // Filter buttons
  var filterBtns = document.querySelectorAll(".filters button");
  filterBtns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      filterBtns.forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-filter");
      render();
    });
  });

  // Review button delegation
  listEl.addEventListener("click", function(e) {
    if (e.target.classList.contains("review-btn")) {
      e.stopPropagation();
      var reqId = e.target.getAttribute("data-req");
      var action = e.target.getAttribute("data-action");

      // Toggle: if already selected, deselect
      if (reviewStates[reqId] === action) {
        delete reviewStates[reqId];
      } else {
        reviewStates[reqId] = action;
      }

      // Update the buttons in this row
      var row = e.target.closest(".req-row");
      var btns = row.querySelectorAll(".review-btn");
      btns.forEach(function(b) {
        b.classList.remove("selected");
        if (reviewStates[reqId] && b.getAttribute("data-action") === reviewStates[reqId]) {
          b.classList.add("selected");
        }
      });

      updateFooter();
    }
  });

  // Export
  exportBtn.addEventListener("click", function() {
    var lines = ["ISMS Policy Document v2.1 — Compliance Report", "ISO 27001:2022 | 2025-01-15 | 73% compliant", ""];
    requirements.forEach(function(req) {
      var state = reviewStates[req.id] ? " [" + reviewStates[req.id] + "]" : "";
      lines.push(req.id + " | " + req.title + " | " + req.status + " | " + (req.confidence || "n/a") + state);
    });
    var reviewed = 0;
    for (var key in reviewStates) {
      if (reviewStates[key]) reviewed++;
    }
    lines.push("");
    lines.push(requirements.length + " requirements, " + reviewed + " reviewed");

    var blob = new Blob([lines.join("\n")], { type: "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "compliance-report.txt";
    a.click();
    URL.revokeObjectURL(url);
  });

  // Initial render
  render();

})();
</script>

</body>
</html>
