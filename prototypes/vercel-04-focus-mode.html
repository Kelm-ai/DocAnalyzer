<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Mode — Compliance Report</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
    color: #000;
    background: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    height: 100vh;
  }

  /* ─── Top Bar ─── */

  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: #fff;
    z-index: 100;
    border-bottom: 1px solid #f0f0f0;
  }

  .top-bar-left a {
    font-size: 13px;
    color: #888;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s;
  }

  .top-bar-left a:hover {
    color: #000;
  }

  .top-bar-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }

  .progress-text {
    font-size: 13px;
    color: #888;
    letter-spacing: 0.3px;
  }

  .progress-bar-track {
    width: 200px;
    height: 2px;
    background: #f0f0f0;
    margin-top: 4px;
    border-radius: 1px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: #000;
    border-radius: 1px;
    transition: width 0.3s ease;
  }

  .top-bar-right {
    font-size: 13px;
    color: #888;
  }

  /* ─── Focus View ─── */

  .focus-view {
    position: fixed;
    top: 48px;
    left: 0;
    right: 0;
    bottom: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
  }

  .focus-content {
    max-width: 600px;
    width: 100%;
    padding: 40px 24px;
    opacity: 1;
    transition: opacity 0.2s ease;
  }

  .focus-content.fading {
    opacity: 0;
  }

  /* Status label */
  .status-label {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .status-label.fail {
    color: #000;
  }

  .status-label.flagged {
    color: #888;
  }

  .status-label.pass {
    color: #bbb;
  }

  .status-label.na {
    color: #ddd;
  }

  /* Title */
  .focus-title {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.3px;
    margin-bottom: 8px;
  }

  /* Metadata */
  .focus-meta {
    font-size: 14px;
    color: #888;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .focus-meta span + span::before {
    content: "\00b7";
    margin: 0 8px;
  }

  /* Divider */
  .focus-divider {
    border: none;
    border-top: 1px solid #eee;
    margin: 20px 0;
  }

  /* Section labels */
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888;
    margin-bottom: 8px;
  }

  /* Evidence blockquote */
  .evidence-block {
    margin-bottom: 24px;
  }

  .evidence-quote {
    border-left: 2px solid #ddd;
    padding-left: 16px;
    font-size: 16px;
    line-height: 1.7;
    color: #333;
    margin-top: 8px;
  }

  /* Gap / Recommendation / Confidence sections */
  .detail-section {
    margin-bottom: 24px;
  }

  .detail-section p {
    font-size: 15px;
    line-height: 1.7;
    color: #333;
    margin-top: 6px;
  }

  /* Review actions */
  .review-section {
    margin-top: 8px;
  }

  .review-buttons {
    display: flex;
    gap: 12px;
    margin-top: 12px;
  }

  .review-btn {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 24px;
    background: #fff;
    color: #000;
    border: 1px solid #000;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    letter-spacing: 0.3px;
  }

  .review-btn:hover {
    background: #f5f5f5;
  }

  .review-btn.selected {
    background: #000;
    color: #fff;
  }

  .review-btn.selected:hover {
    background: #222;
  }

  /* ─── Bottom Bar ─── */

  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: #fff;
    border-top: 1px solid #f0f0f0;
    z-index: 100;
  }

  .nav-btn {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 20px;
    background: #fff;
    color: #000;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    min-width: 110px;
  }

  .nav-btn:hover {
    border-color: #000;
  }

  .nav-btn:disabled {
    color: #ccc;
    border-color: #eee;
    cursor: default;
  }

  .nav-btn:disabled:hover {
    border-color: #eee;
    background: #fff;
  }

  .keyboard-hint {
    font-size: 12px;
    color: #bbb;
    letter-spacing: 0.2px;
    text-align: center;
  }

  /* ─── Overview Mode ─── */

  .overview-view {
    display: none;
    position: fixed;
    top: 48px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    background: #fff;
  }

  .overview-view.active {
    display: block;
  }

  .overview-container {
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .overview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .overview-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  .overview-compliance {
    font-size: 14px;
    color: #888;
  }

  .overview-subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 32px;
  }

  .overview-divider {
    border: none;
    border-top: 1px solid #eee;
    margin: 0;
  }

  .overview-row {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f5f5f5;
    cursor: pointer;
    transition: background 0.1s;
    gap: 12px;
  }

  .overview-row:hover {
    background: #fafafa;
    margin: 0 -12px;
    padding: 12px 12px;
  }

  .overview-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .overview-dot.fail { background: #000; }
  .overview-dot.flagged { background: #999; }
  .overview-dot.pass { background: #ccc; }
  .overview-dot.na { background: #e5e5e5; }

  .overview-id {
    font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    color: #888;
    flex-shrink: 0;
    min-width: 80px;
  }

  .overview-req-title {
    font-size: 15px;
    color: #000;
    flex: 1;
    line-height: 1.4;
  }

  .overview-review-status {
    font-size: 12px;
    color: #bbb;
    flex-shrink: 0;
    text-transform: lowercase;
    min-width: 70px;
    text-align: right;
  }

  .overview-review-status.approved {
    color: #000;
    font-weight: 600;
  }

  .overview-review-status.rejected {
    color: #888;
    font-weight: 600;
  }

  .overview-review-status.skipped {
    color: #aaa;
  }

  .overview-summary {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid #eee;
    font-size: 14px;
    color: #888;
    line-height: 1.6;
  }

  .overview-summary .count {
    color: #000;
    font-weight: 600;
  }

  .overview-summary .sep {
    margin: 0 6px;
  }

  /* ─── Transitions ─── */

  .focus-view.hidden {
    display: none;
  }

  .bottom-bar.hidden {
    display: none;
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="top-bar-left">
    <a id="overviewToggle">&larr; back to overview</a>
  </div>
  <div class="top-bar-center">
    <div class="progress-text" id="progressText">1 of 15</div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill" style="width: 6.67%"></div>
    </div>
  </div>
  <div class="top-bar-right" id="complianceLabel">73% compliance</div>
</div>

<!-- Focus View -->
<div class="focus-view" id="focusView">
  <div class="focus-content" id="focusContent">
    <!-- Dynamically populated -->
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar" id="bottomBar">
  <button class="nav-btn" id="prevBtn">&larr; Previous</button>
  <span class="keyboard-hint">&larr; &rarr; to navigate &middot; enter to approve</span>
  <button class="nav-btn" id="nextBtn">Next &rarr;</button>
</div>

<!-- Overview View -->
<div class="overview-view" id="overviewView">
  <div class="overview-container">
    <div class="overview-header">
      <div class="overview-title">ISMS Policy Document v2.1</div>
      <div class="overview-compliance">73% compliant</div>
    </div>
    <div class="overview-subtitle">ISO 27001:2022 &middot; 15 requirements &middot; AI assessment</div>
    <hr class="overview-divider">
    <div id="overviewList"></div>
    <div class="overview-summary" id="overviewSummary"></div>
  </div>
</div>

<script>
(function() {

  // ─── Mock Data ───

  var requirements = [
    // FAILURES
    {
      id: "REQ-6.1.2",
      title: "Risk Assessment Process",
      clause: "Clause 6.1",
      status: "fail",
      confidence: "Medium",
      evidence: "The organization shall ensure information security risks are managed appropriately. Risk management is referenced in general terms throughout the policy document, including statements such as: \"Management shall ensure that risks to information assets are identified and treated in accordance with the organization's risk appetite\" (Section 4.2). However, no structured methodology is described.",
      gap: "No documented risk assessment methodology found. The policy references risk management in general terms but lacks a specific, repeatable process for identifying, analyzing, and evaluating information security risks as required by ISO 27001 Clause 6.1.2.",
      recommendation: "Develop and document a formal risk assessment methodology that includes: criteria for risk acceptance, defined risk assessment frequency, a repeatable process for identification, analysis, and evaluation of information security risks, and clear assignment of risk owners.",
      confidenceExplanation: "Medium — partial evidence found in policy document referencing risk management, but insufficient detail to demonstrate a compliant risk assessment process."
    },
    {
      id: "REQ-8.1.1",
      title: "Operational Planning and Control",
      clause: "Clause 8.1",
      status: "fail",
      confidence: "High",
      evidence: "Security controls shall be implemented as deemed necessary by management. The policy states: \"Appropriate technical and organizational measures shall be maintained to protect information assets\" (Section 7.1). Operational implementation details are deferred to departmental procedures that were not provided for review.",
      gap: "No documented operational procedures for security controls were found. The policy acknowledges the need for controls but does not define specific operational planning, implementation criteria, or control processes required by Clause 8.1.",
      recommendation: "Create detailed operational procedures for each security control, including: implementation steps, responsible parties, required resources, expected outcomes, and criteria for determining when controls are operating effectively.",
      confidenceExplanation: "High — clear absence of required operational planning documentation. The policy explicitly defers to external procedures that were not available."
    },
    {
      id: "REQ-6.2.1",
      title: "Information Security Objectives",
      clause: "Clause 6.2",
      status: "fail",
      confidence: "High",
      evidence: "The organization is committed to maintaining a high level of information security. The policy includes the general statement: \"Our objective is to protect the confidentiality, integrity, and availability of all information assets\" (Section 1.3). No further detail on measurable objectives is provided.",
      gap: "No measurable information security objectives are defined. The policy contains only a high-level aspirational statement without specific, measurable targets, assigned responsibilities, timelines, or methods for monitoring achievement as required by Clause 6.2.",
      recommendation: "Define SMART (Specific, Measurable, Achievable, Relevant, Time-bound) information security objectives at relevant functions and levels, establish plans to achieve them, and define how results will be monitored and evaluated.",
      confidenceExplanation: "High — the policy clearly lacks measurable objectives. Only a generic commitment statement was found, which does not satisfy the requirements of Clause 6.2."
    },
    // FLAGGED
    {
      id: "REQ-7.2.1",
      title: "Competence Requirements",
      clause: "Clause 7.2",
      status: "flagged",
      confidence: "Low",
      evidence: "Staff shall receive appropriate information security training upon joining and annually thereafter. The policy includes: \"All personnel with ISMS responsibilities shall be competent on the basis of appropriate education, training, or experience\" (Section 5.4). A training schedule template was referenced but not included in the reviewed documents.",
      gap: "A partial competence framework was found referencing training requirements, but no evidence of implementation, completion records, or competence evaluation criteria was available. The referenced training schedule was not provided for review.",
      recommendation: "Implement a competence tracking system that includes: defined competence criteria for each ISMS role, records of education, training, and experience, periodic competence assessments, and evidence of actions taken to address competence gaps.",
      confidenceExplanation: "Low — limited evidence found. Training requirements are mentioned but no implementation evidence or supporting documents were available for verification."
    },
    {
      id: "REQ-9.1.1",
      title: "Monitoring and Measurement",
      clause: "Clause 9.1",
      status: "flagged",
      confidence: "Medium",
      evidence: "Information security performance shall be monitored and reported to management. The policy states: \"The CISO shall report on ISMS performance including security incidents, risk status, and compliance metrics at quarterly management meetings\" (Section 8.2). However, specific metrics and measurement methods are not defined.",
      gap: "Monitoring requirements are mentioned and a quarterly reporting cadence is established, but no specific metrics, KPIs, measurement methods, or criteria for evaluating information security performance are defined as required by Clause 9.1.",
      recommendation: "Define specific security metrics and KPIs including: what will be monitored and measured, methods for monitoring and measurement, when monitoring and measuring shall be performed, who shall analyze and evaluate results, and how results will be reported.",
      confidenceExplanation: "Medium — partial evidence found with quarterly reporting mentioned, but the specific measurement framework required by the clause is absent."
    },
    {
      id: "REQ-9.3.1",
      title: "Management Review Inputs",
      clause: "Clause 9.3",
      status: "flagged",
      confidence: "Medium",
      evidence: "Management shall review the ISMS at planned intervals to ensure its continuing suitability, adequacy, and effectiveness. The policy describes: \"Senior management shall conduct an annual review covering ISMS performance, audit findings, and the status of corrective actions\" (Section 9.1).",
      gap: "A management review process exists with annual frequency, but the required input items are incomplete. Missing inputs include: changes in external and internal issues, feedback on information security performance including trends, opportunities for continual improvement, and results of risk assessment updates.",
      recommendation: "Update the management review procedure to include all required inputs per Clause 9.3: status of actions from previous reviews, changes in issues relevant to the ISMS, nonconformities and corrective actions, monitoring and measurement results, audit results, fulfillment of objectives, and feedback from interested parties.",
      confidenceExplanation: "Medium — partial evidence found. A management review process exists but does not cover all required input categories specified in the standard."
    },
    // PASSED
    {
      id: "REQ-5.1.1",
      title: "Leadership Commitment",
      clause: "Clause 5.1",
      status: "pass",
      confidence: "High",
      evidence: "The Board of Directors and Senior Management are committed to supporting information security across the organization. The policy includes: \"The CEO and Board of Directors endorse this policy and commit to providing the leadership and resources necessary for an effective ISMS\" (Section 2.1). The document is signed by the CEO and dated.",
      gap: null,
      recommendation: null,
      confidenceExplanation: "High — strong evidence found. Explicit leadership commitment statement with CEO endorsement and signature."
    },
    {
      id: "REQ-5.2.1",
      title: "Information Security Policy",
      clause: "Clause 5.2",
      status: "pass",
      confidence: "High",
      evidence: "This Information Security Policy establishes the framework for managing information security risks and protecting the organization's information assets. The policy document is formally structured with: purpose, scope, policy statements, roles and responsibilities, and review procedures (Section 1.1). It includes a commitment to satisfy applicable requirements and continual improvement.",
      gap: null,
      recommendation: null,
      confidenceExplanation: "High — strong evidence found. A comprehensive, well-structured information security policy document that meets the requirements of the clause."
    },
    {
      id: "REQ-5.3.1",
      title: "Organizational Roles",
      clause: "Clause 5.3",
      status: "pass",
      confidence: "Medium",
      evidence: "The CISO is responsible for the overall ISMS, including its implementation, maintenance, and continual improvement. Department heads are responsible for implementing security controls within their areas. Additional roles described include: Information Security Manager, IT Security Team, Data Protection Officer, and departmental Security Champions (Section 3.1).",
      gap: null,
      recommendation: null,
      confidenceExplanation: "Medium — partial evidence found. Roles are defined but the authority and reporting relationships could be more explicitly documented."
    },
    {
      id: "REQ-7.1.1",
      title: "Resources",
      clause: "Clause 7.1",
      status: "pass",
      confidence: "High",
      evidence: "The organization shall provide the resources needed for the establishment, implementation, maintenance, and continual improvement of the ISMS, including dedicated budget allocation. The policy states: \"An annual information security budget shall be approved by the Board and managed by the CISO\" (Section 5.1).",
      gap: null,
      recommendation: null,
      confidenceExplanation: "High — strong evidence found. Explicit commitment to resource provision with defined budget allocation process."
    },
    {
      id: "REQ-7.3.1",
      title: "Awareness",
      clause: "Clause 7.3",
      status: "pass",
      confidence: "High",
      evidence: "All employees shall be made aware of the information security policy, their contribution to the effectiveness of the ISMS, and the implications of not conforming. The policy states: \"A mandatory security awareness program shall be maintained, including induction training for new staff and annual refresher sessions\" (Section 5.5).",
      gap: null,
      recommendation: null,
      confidenceExplanation: "High — strong evidence found. A comprehensive awareness program is described covering all required elements."
    },
    {
      id: "REQ-7.4.1",
      title: "Communication",
      clause: "Clause 7.4",
      status: "pass",
      confidence: "Medium",
      evidence: "Communications regarding information security shall follow the defined communication plan. The policy describes: \"Internal and external communications on information security matters shall be managed through designated channels, with the Communications team and CISO coordinating public disclosures\" (Section 5.6).",
      gap: null,
      recommendation: null,
      confidenceExplanation: "Medium — partial evidence found. A communication approach is described but lacks full detail on what, when, with whom, and by whom communications shall occur."
    },
    {
      id: "REQ-9.2.1",
      title: "Internal Audit",
      clause: "Clause 9.2",
      status: "pass",
      confidence: "High",
      evidence: "Internal audits of the ISMS shall be conducted at planned intervals, at least annually, to verify that the ISMS conforms to requirements and is effectively implemented. The policy states: \"The Internal Audit team shall develop an annual ISMS audit plan considering the importance of processes and results of previous audits\" (Section 8.3).",
      gap: null,
      recommendation: null,
      confidenceExplanation: "High — strong evidence found. Audit requirements are well-defined with frequency, planning considerations, and responsible parties identified."
    },
    {
      id: "REQ-7.5.1",
      title: "Documented Information",
      clause: "Clause 7.5",
      status: "pass",
      confidence: "High",
      evidence: "All ISMS documentation shall be controlled, versioned, and maintained according to the document management procedure. The policy includes: \"Documents shall carry version numbers, review dates, and approval signatures. A master document register shall be maintained and access controlled based on need-to-know\" (Section 5.7).",
      gap: null,
      recommendation: null,
      confidenceExplanation: "High — strong evidence found. Comprehensive document control requirements are defined including versioning, review, approval, and access control."
    },
    // N/A
    {
      id: "REQ-8.2.1",
      title: "Information Security Risk Assessment",
      clause: "Clause 8.2",
      status: "na",
      confidence: null,
      evidence: "This requirement is assessed under REQ-6.1.2 (Risk Assessment Process). Clause 8.2 requires performing risk assessments at planned intervals or when significant changes occur. As the risk assessment methodology itself was found non-compliant under REQ-6.1.2, a separate assessment here would be redundant.",
      gap: null,
      recommendation: null,
      confidenceExplanation: null
    }
  ];

  // Sort: fail -> flagged -> pass -> na
  var statusOrder = { fail: 0, flagged: 1, pass: 2, na: 3 };
  requirements.sort(function(a, b) {
    return statusOrder[a.status] - statusOrder[b.status];
  });

  // ─── State ───

  var currentIndex = 0;
  var reviewStates = {}; // reqId -> "approved" | "rejected" | "skipped"
  var isOverviewMode = false;

  // ─── DOM Refs ───

  var focusView = document.getElementById("focusView");
  var focusContent = document.getElementById("focusContent");
  var bottomBar = document.getElementById("bottomBar");
  var overviewView = document.getElementById("overviewView");
  var overviewList = document.getElementById("overviewList");
  var overviewSummary = document.getElementById("overviewSummary");
  var progressText = document.getElementById("progressText");
  var progressFill = document.getElementById("progressFill");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var overviewToggle = document.getElementById("overviewToggle");

  // ─── Helpers ───

  function escHtml(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function statusLabel(status) {
    var map = { fail: "FAILED", flagged: "FLAGGED", pass: "PASSED", na: "N/A" };
    return map[status] || status;
  }

  function getReviewCounts() {
    var counts = { approved: 0, rejected: 0, skipped: 0, pending: 0 };
    requirements.forEach(function(req) {
      var state = reviewStates[req.id];
      if (state) {
        counts[state]++;
      } else {
        counts.pending++;
      }
    });
    return counts;
  }

  // ─── Render Focus View ───

  function renderFocus(animate) {
    var req = requirements[currentIndex];

    // Update progress
    progressText.textContent = (currentIndex + 1) + " of " + requirements.length;
    var pct = ((currentIndex + 1) / requirements.length) * 100;
    progressFill.style.width = pct + "%";

    // Update nav buttons
    prevBtn.disabled = (currentIndex === 0);
    nextBtn.disabled = (currentIndex === requirements.length - 1);

    if (animate) {
      focusContent.classList.add("fading");
      setTimeout(function() {
        buildFocusContent(req);
        focusContent.classList.remove("fading");
      }, 150);
    } else {
      buildFocusContent(req);
    }
  }

  function buildFocusContent(req) {
    var html = "";

    // Status
    html += '<div class="status-label ' + req.status + '">' + statusLabel(req.status) + '</div>';

    // Title
    html += '<div class="focus-title">' + escHtml(req.title) + '</div>';

    // Metadata
    html += '<div class="focus-meta">';
    html += '<span>' + escHtml(req.id) + '</span>';
    html += '<span>' + escHtml(req.clause) + '</span>';
    if (req.confidence) {
      html += '<span>Confidence: ' + escHtml(req.confidence) + '</span>';
    }
    html += '</div>';

    // Divider
    html += '<hr class="focus-divider">';

    // Evidence
    if (req.evidence) {
      html += '<div class="evidence-block">';
      html += '<div class="section-label">evidence</div>';
      html += '<div class="evidence-quote">' + escHtml(req.evidence) + '</div>';
      html += '</div>';
    }

    // Gap
    if (req.gap) {
      html += '<div class="detail-section">';
      html += '<div class="section-label">gap</div>';
      html += '<p>' + escHtml(req.gap) + '</p>';
      html += '</div>';
    }

    // Recommendation
    if (req.recommendation) {
      html += '<div class="detail-section">';
      html += '<div class="section-label">recommendation</div>';
      html += '<p>' + escHtml(req.recommendation) + '</p>';
      html += '</div>';
    }

    // Confidence explanation
    if (req.confidenceExplanation) {
      html += '<div class="detail-section">';
      html += '<div class="section-label">ai confidence</div>';
      html += '<p>' + escHtml(req.confidenceExplanation) + '</p>';
      html += '</div>';
    }

    // Divider
    html += '<hr class="focus-divider">';

    // Review section
    var state = reviewStates[req.id] || null;
    html += '<div class="review-section">';
    html += '<div class="review-buttons">';
    html += '<button class="review-btn' + (state === "approved" ? " selected" : "") + '" data-action="approved">approve</button>';
    html += '<button class="review-btn' + (state === "rejected" ? " selected" : "") + '" data-action="rejected">reject</button>';
    html += '<button class="review-btn' + (state === "skipped" ? " selected" : "") + '" data-action="skipped">skip</button>';
    html += '</div>';
    html += '</div>';

    focusContent.innerHTML = html;

    // Scroll focus view to top
    focusView.scrollTop = 0;

    // Bind review buttons
    var btns = focusContent.querySelectorAll(".review-btn");
    btns.forEach(function(btn) {
      btn.addEventListener("click", function() {
        var action = btn.getAttribute("data-action");
        handleReviewAction(action);
      });
    });
  }

  function handleReviewAction(action) {
    var req = requirements[currentIndex];

    // Toggle: if already selected, deselect
    if (reviewStates[req.id] === action) {
      delete reviewStates[req.id];
      // Re-render buttons without advancing
      var btns = focusContent.querySelectorAll(".review-btn");
      btns.forEach(function(b) { b.classList.remove("selected"); });
      return;
    }

    reviewStates[req.id] = action;

    // Update buttons visually
    var btns = focusContent.querySelectorAll(".review-btn");
    btns.forEach(function(b) {
      b.classList.remove("selected");
      if (b.getAttribute("data-action") === action) {
        b.classList.add("selected");
      }
    });

    // Auto-advance after brief delay
    if (currentIndex < requirements.length - 1) {
      setTimeout(function() {
        goNext(true);
      }, 300);
    }
  }

  // ─── Navigation ───

  function goPrev(animate) {
    if (currentIndex > 0) {
      currentIndex--;
      renderFocus(animate !== false);
    }
  }

  function goNext(animate) {
    if (currentIndex < requirements.length - 1) {
      currentIndex++;
      renderFocus(animate !== false);
    }
  }

  function goToIndex(idx) {
    if (idx >= 0 && idx < requirements.length) {
      currentIndex = idx;
      showFocusMode();
      renderFocus(false);
    }
  }

  // ─── Overview Mode ───

  function showOverviewMode() {
    isOverviewMode = true;
    focusView.classList.add("hidden");
    bottomBar.classList.add("hidden");
    overviewView.classList.add("active");
    overviewToggle.innerHTML = "focus mode";
    renderOverview();
  }

  function showFocusMode() {
    isOverviewMode = false;
    focusView.classList.remove("hidden");
    bottomBar.classList.remove("hidden");
    overviewView.classList.remove("active");
    overviewToggle.innerHTML = "&larr; back to overview";
  }

  function renderOverview() {
    overviewList.innerHTML = "";

    requirements.forEach(function(req, idx) {
      var row = document.createElement("div");
      row.className = "overview-row";

      // Dot
      var dot = document.createElement("span");
      dot.className = "overview-dot " + req.status;

      // ID
      var idEl = document.createElement("span");
      idEl.className = "overview-id";
      idEl.textContent = req.id;

      // Title
      var titleEl = document.createElement("span");
      titleEl.className = "overview-req-title";
      titleEl.textContent = req.title;

      // Review status
      var reviewEl = document.createElement("span");
      var rState = reviewStates[req.id] || "pending";
      reviewEl.className = "overview-review-status " + rState;
      reviewEl.textContent = rState;

      row.appendChild(dot);
      row.appendChild(idEl);
      row.appendChild(titleEl);
      row.appendChild(reviewEl);

      row.addEventListener("click", function() {
        goToIndex(idx);
      });

      overviewList.appendChild(row);
    });

    // Summary
    var counts = getReviewCounts();
    var parts = [];
    if (counts.approved > 0) parts.push('<span class="count">' + counts.approved + ' approved</span>');
    if (counts.rejected > 0) parts.push('<span class="count">' + counts.rejected + ' rejected</span>');
    if (counts.skipped > 0) parts.push(counts.skipped + ' skipped');
    if (counts.pending > 0) parts.push(counts.pending + ' pending');
    overviewSummary.innerHTML = parts.join('<span class="sep">&middot;</span>');
  }

  // ─── Event Listeners ───

  // Overview toggle
  overviewToggle.addEventListener("click", function(e) {
    e.preventDefault();
    if (isOverviewMode) {
      showFocusMode();
      renderFocus(false);
    } else {
      showOverviewMode();
    }
  });

  // Prev / Next buttons
  prevBtn.addEventListener("click", function() {
    goPrev(true);
  });

  nextBtn.addEventListener("click", function() {
    goNext(true);
  });

  // Keyboard navigation
  document.addEventListener("keydown", function(e) {
    // Don't intercept if user is focused on an input or textarea
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

    if (isOverviewMode) {
      // Escape goes back to focus mode
      if (e.key === "Escape") {
        showFocusMode();
        renderFocus(false);
        e.preventDefault();
      }
      return;
    }

    switch (e.key) {
      case "ArrowLeft":
        goPrev(true);
        e.preventDefault();
        break;
      case "ArrowRight":
        goNext(true);
        e.preventDefault();
        break;
      case "Enter":
        handleReviewAction("approved");
        e.preventDefault();
        break;
      case "r":
      case "R":
        handleReviewAction("rejected");
        e.preventDefault();
        break;
      case "s":
      case "S":
        handleReviewAction("skipped");
        e.preventDefault();
        break;
      case "Escape":
        showOverviewMode();
        e.preventDefault();
        break;
    }
  });

  // ─── Initial Render ───

  renderFocus(false);

})();
</script>

</body>
</html>
