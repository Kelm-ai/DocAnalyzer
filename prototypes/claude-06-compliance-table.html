<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compliance Table — Compliance Report</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #5a4a3f;
    background: #faf7f2;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ───────────────────────────────── */
  .header {
    background: #fffdf9;
    border-bottom: 1px solid #ebe4da;
    padding: 24px 40px;
    box-shadow: 0 1px 4px rgba(90, 74, 63, 0.08);
  }
  .header-inner {
    max-width: 1120px;
    margin: 0 auto;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-title {
    font-size: 18px;
    font-weight: 600;
    color: #5a4a3f;
    position: relative;
    padding-bottom: 6px;
  }
  .header-title::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 40px;
    height: 2px;
    background: #da7756;
    border-radius: 1px;
  }
  .header-subtitle {
    font-size: 13px;
    color: #8a7a6e;
    margin-top: 8px;
  }
  .header-subtitle span { margin-right: 16px; }
  .ai-notice {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #a89888;
    border: 1px solid #e0d6ca;
    border-radius: 20px;
    padding: 5px 14px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .ai-notice::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #da7756;
    flex-shrink: 0;
  }

  /* ── Main Container ───────────────────────── */
  .main {
    max-width: 1120px;
    margin: 28px auto;
    padding: 0 24px;
  }

  /* ── Filter Bar ───────────────────────────── */
  .filter-bar {
    background: #fffdf9;
    border: 1px solid #ebe4da;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(90, 74, 63, 0.08);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .filter-bar select,
  .filter-bar input[type="text"] {
    font-family: inherit;
    font-size: 13px;
    color: #5a4a3f;
    background: #faf7f2;
    border: 1px solid #ebe4da;
    border-radius: 6px;
    padding: 7px 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .filter-bar select { padding-right: 28px; cursor: pointer; }
  .filter-bar select:focus,
  .filter-bar input[type="text"]:focus {
    border-color: #da7756;
    box-shadow: 0 0 0 2px rgba(218, 119, 86, 0.15);
  }
  .filter-bar input[type="text"] {
    width: 200px;
  }
  .filter-bar input[type="text"]::placeholder {
    color: #b5a99a;
  }
  .filter-spacer { flex: 1; }
  .filter-count {
    font-size: 12px;
    color: #8a7a6e;
    white-space: nowrap;
  }
  .btn-secondary {
    font-family: inherit;
    font-size: 13px;
    color: #8a7a6e;
    background: transparent;
    border: 1px solid #ebe4da;
    border-radius: 6px;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .btn-secondary:hover {
    background: #f5f0e8;
    color: #5a4a3f;
  }

  /* ── Table Card ───────────────────────────── */
  .table-card {
    background: #fffdf9;
    border: 1px solid #ebe4da;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(90, 74, 63, 0.08);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    background: #f5f0e8;
    color: #8a7a6e;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid #ebe4da;
    white-space: nowrap;
    user-select: none;
  }
  tbody tr.data-row {
    cursor: pointer;
    transition: background 0.15s;
  }
  tbody tr.data-row:hover {
    background: #faf5ed;
  }
  tbody tr.data-row td {
    padding: 12px 16px;
    font-size: 13px;
    border-bottom: 1px solid rgba(235, 228, 218, 0.4);
    vertical-align: middle;
  }
  tbody tr.data-row:last-child td {
    border-bottom: none;
  }

  /* ── Status ───────────────────────────────── */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-pass .status-dot { background: #5a9a6a; }
  .status-pass { color: #4a8a5a; }
  .status-fail .status-dot { background: #c44040; }
  .status-fail { color: #c44040; }
  .status-flagged .status-dot { background: #d4912a; }
  .status-flagged { color: #b87a20; }
  .status-na .status-dot { background: #b5a99a; }
  .status-na { color: #8a7a6e; }

  /* ── ID & Title ───────────────────────────── */
  .cell-id {
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 12px;
    color: #8a7a6e;
  }
  .cell-title {
    font-weight: 500;
    color: #5a4a3f;
  }
  .cell-clause {
    font-size: 12px;
    color: #8a7a6e;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }

  /* ── Confidence Bar ───────────────────────── */
  .confidence-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .confidence-bar-track {
    width: 40px;
    height: 4px;
    background: #ebe4da;
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .confidence-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }
  .confidence-high .confidence-bar-fill {
    width: 100%;
    background: #5a9a6a;
  }
  .confidence-medium .confidence-bar-fill {
    width: 60%;
    background: #d4912a;
  }
  .confidence-low .confidence-bar-fill {
    width: 30%;
    background: #b5a99a;
  }
  .confidence-label {
    font-size: 12px;
    white-space: nowrap;
  }
  .confidence-high .confidence-label { color: #4a8a5a; }
  .confidence-medium .confidence-label { color: #b87a20; }
  .confidence-low .confidence-label { color: #8a7a6e; }

  /* ── Review Badge ─────────────────────────── */
  .review-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .review-pending {
    color: #8a7a6e;
    background: #f0ece6;
  }
  .review-approved {
    color: #4a8a5a;
    background: #edf5ef;
  }
  .review-rejected {
    color: #c44040;
    background: #fdecea;
  }

  /* ── Expanded Detail Row ──────────────────── */
  tr.detail-row td {
    padding: 0;
    border-bottom: 1px solid rgba(235, 228, 218, 0.4);
  }
  .detail-content {
    background: #faf7f2;
    border-left: 3px solid #da7756;
    margin: 0 16px 16px 16px;
    border-radius: 0 8px 8px 0;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .detail-section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #8a7a6e;
    margin-bottom: 4px;
  }
  .detail-evidence {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 14px;
    color: #6a5a4f;
    line-height: 1.7;
    position: relative;
    padding-left: 18px;
  }
  .detail-evidence::before {
    content: '\201C';
    position: absolute;
    left: 0;
    top: -4px;
    font-size: 26px;
    color: #b5a99a;
    font-family: Georgia, serif;
  }
  .detail-gap {
    background: #fdecea;
    color: #c44040;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  .detail-recommendation {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 14px;
    color: #5a4a3f;
    line-height: 1.7;
  }
  .detail-na-reason {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 14px;
    color: #8a7a6e;
    font-style: italic;
    line-height: 1.7;
  }
  .detail-confidence-note {
    font-size: 12px;
    color: #8a7a6e;
    line-height: 1.6;
    font-style: italic;
  }
  .detail-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .btn-approve {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    background: #da7756;
    border: none;
    border-radius: 6px;
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-approve:hover { background: #c4674a; }
  .btn-reject {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    background: #c44040;
    border: none;
    border-radius: 6px;
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-reject:hover { background: #a83535; }

  /* ── Footer ───────────────────────────────── */
  .footer {
    max-width: 1120px;
    margin: 20px auto 40px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .footer-status {
    font-size: 13px;
    color: #8a7a6e;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .footer-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #da7756;
    flex-shrink: 0;
  }
  .footer-count-num {
    font-weight: 600;
    color: #5a4a3f;
  }

  /* ── Utility ──────────────────────────────── */
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────── -->
<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div>
        <div class="header-title">Compliance Report</div>
        <div class="header-subtitle">
          <span>ISO 27001:2022</span>
          <span>Information Security Policy v2.1</span>
          <span>Assessed Feb 2026</span>
        </div>
      </div>
      <div class="ai-notice">AI-assisted assessment — every finding needs your review</div>
    </div>
  </div>
</header>

<!-- ── Main ─────────────────────────────────────── -->
<div class="main">

  <!-- Filter Bar -->
  <div class="filter-bar">
    <select id="filterStatus">
      <option value="">All Statuses</option>
      <option value="fail">Fail</option>
      <option value="flagged">Flagged</option>
      <option value="pass">Pass</option>
      <option value="na">N/A</option>
    </select>
    <select id="filterClause">
      <option value="">All Clauses</option>
    </select>
    <select id="filterConfidence">
      <option value="">All Confidence</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <input type="text" id="filterSearch" placeholder="Search requirements...">
    <span class="filter-spacer"></span>
    <span class="filter-count" id="filterCount">Showing 15 of 15</span>
    <button class="btn-secondary" id="btnExportTop" title="Export to CSV">Export</button>
  </div>

  <!-- Table -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th style="width:100px">Status</th>
          <th style="width:110px">ID</th>
          <th>Title</th>
          <th style="width:80px">Clause</th>
          <th style="width:150px">Confidence</th>
          <th style="width:100px">Review</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- ── Footer ──────────────────────────────────── -->
<div class="footer">
  <div class="footer-status">
    <span class="footer-dot"></span>
    <span><span class="footer-count-num" id="reviewedCount">0</span> of 15 reviewed</span>
  </div>
  <button class="btn-secondary" id="btnExportBottom">Export</button>
</div>

<script>
const DATA = [
  { id:"REQ-6.1.2", title:"Risk Assessment Process", clause:"6.1", status:"fail", confidence:"medium", gap:"No documented risk assessment methodology found. The policy references risk management in general terms but lacks a specific, repeatable process.", evidence:"The organization shall ensure information security risks are managed appropriately (Section 4.2)", recommendation:"Develop and document a formal risk assessment methodology.", reason:null, review:"pending" },
  { id:"REQ-8.1.1", title:"Operational Planning and Control", clause:"8.1", status:"fail", confidence:"high", gap:"Missing documented operational procedures for security controls.", evidence:"Security controls shall be implemented as deemed necessary by management (Section 7.1)", recommendation:"Create detailed operational procedures for each security control.", reason:null, review:"pending" },
  { id:"REQ-6.2.1", title:"Information Security Objectives", clause:"6.2", status:"fail", confidence:"high", gap:"No measurable information security objectives defined.", evidence:"The organization is committed to maintaining a high level of information security (Section 1.3)", recommendation:"Define SMART information security objectives.", reason:null, review:"pending" },
  { id:"REQ-7.2.1", title:"Competence Requirements", clause:"7.2", status:"flagged", confidence:"low", gap:"Partial competence framework found but missing evidence of implementation.", evidence:"Staff shall receive appropriate information security training upon joining and annually thereafter (Section 5.4)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-9.1.1", title:"Monitoring and Measurement", clause:"9.1", status:"flagged", confidence:"medium", gap:"Monitoring requirements mentioned but no specific metrics or KPIs defined.", evidence:"Information security performance shall be monitored and reported to management (Section 8.2)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-9.3.1", title:"Management Review Inputs", clause:"9.3", status:"flagged", confidence:"medium", gap:"Management review process exists but input requirements are incomplete.", evidence:"Management shall review the ISMS at planned intervals (Section 9.1)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-5.1.1", title:"Leadership Commitment", clause:"5.1", status:"pass", confidence:"high", gap:null, evidence:"The Board of Directors and Senior Management are committed to supporting information security (Section 2.1)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-5.2.1", title:"Information Security Policy", clause:"5.2", status:"pass", confidence:"high", gap:null, evidence:"This Information Security Policy establishes the framework for managing information security risks (Section 1.1)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-5.3.1", title:"Organizational Roles", clause:"5.3", status:"pass", confidence:"medium", gap:null, evidence:"The CISO is responsible for the overall ISMS. Department heads implement controls in their areas (Section 3.1)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-7.1.1", title:"Resources", clause:"7.1", status:"pass", confidence:"high", gap:null, evidence:"The organization shall provide resources needed for the ISMS including budget allocation reviewed annually (Section 5.1)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-7.3.1", title:"Awareness", clause:"7.3", status:"pass", confidence:"high", gap:null, evidence:"All employees shall be made aware of the information security policy (Section 5.5)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-7.4.1", title:"Communication", clause:"7.4", status:"pass", confidence:"medium", gap:null, evidence:"Internal and external communications shall follow the defined communication plan (Section 5.6)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-9.2.1", title:"Internal Audit", clause:"9.2", status:"pass", confidence:"high", gap:null, evidence:"Internal audits shall be conducted at planned intervals, at least annually (Section 8.3)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-7.5.1", title:"Documented Information", clause:"7.5", status:"pass", confidence:"high", gap:null, evidence:"All ISMS documentation shall be controlled, versioned, and maintained (Section 5.7)", recommendation:null, reason:null, review:"pending" },
  { id:"REQ-8.2.1", title:"Risk Assessment (Separate)", clause:"8.2", status:"na", confidence:"high", gap:null, evidence:null, recommendation:null, reason:"Assessed under REQ-6.1.2", review:"pending" }
];

const CONFIDENCE_NOTES = {
  high: "High confidence: Strong, explicit evidence found in the document directly addressing this requirement.",
  medium: "Medium confidence: Partial or indirect evidence found. The document references the topic but may lack specificity.",
  low: "Low confidence: Weak or ambiguous evidence. Interpretation required; manual review strongly recommended."
};

const STATUS_ORDER = { fail: 0, flagged: 1, pass: 2, na: 3 };
const STATUS_LABELS = { fail: "Fail", flagged: "Flagged", pass: "Pass", na: "N/A" };

let expandedId = null;

// ── Populate clause dropdown ─────────────────────
function populateClauses() {
  const clauses = [...new Set(DATA.map(d => d.clause))].sort((a, b) => parseFloat(a) - parseFloat(b));
  const sel = document.getElementById('filterClause');
  clauses.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = 'Clause ' + c;
    sel.appendChild(opt);
  });
}

// ── Sort data ────────────────────────────────────
function sortedData() {
  return [...DATA].sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status]);
}

// ── Filter logic ─────────────────────────────────
function getFiltered() {
  const status = document.getElementById('filterStatus').value;
  const clause = document.getElementById('filterClause').value;
  const confidence = document.getElementById('filterConfidence').value;
  const search = document.getElementById('filterSearch').value.toLowerCase().trim();

  return sortedData().filter(d => {
    if (status && d.status !== status) return false;
    if (clause && d.clause !== clause) return false;
    if (confidence && d.confidence !== confidence) return false;
    if (search && !(d.id.toLowerCase().includes(search) || d.title.toLowerCase().includes(search) || d.clause.toLowerCase().includes(search))) return false;
    return true;
  });
}

// ── Build a data row ─────────────────────────────
function buildDataRow(item) {
  const tr = document.createElement('tr');
  tr.className = 'data-row';
  tr.dataset.id = item.id;

  const reviewClass = item.review === 'approved' ? 'review-approved' : item.review === 'rejected' ? 'review-rejected' : 'review-pending';
  const reviewLabel = item.review === 'approved' ? 'Approved' : item.review === 'rejected' ? 'Rejected' : 'Pending';

  tr.innerHTML =
    '<td><span class="status-badge status-' + item.status + '"><span class="status-dot"></span>' + STATUS_LABELS[item.status] + '</span></td>' +
    '<td class="cell-id">' + item.id + '</td>' +
    '<td class="cell-title">' + item.title + '</td>' +
    '<td class="cell-clause">' + item.clause + '</td>' +
    '<td><div class="confidence-cell confidence-' + item.confidence + '"><div class="confidence-bar-track"><div class="confidence-bar-fill"></div></div><span class="confidence-label">' + capitalize(item.confidence) + '</span></div></td>' +
    '<td><span class="review-badge ' + reviewClass + '">' + reviewLabel + '</span></td>';

  tr.addEventListener('click', function() { toggleExpand(item.id); });
  return tr;
}

// ── Build detail row ─────────────────────────────
function buildDetailRow(item) {
  const tr = document.createElement('tr');
  tr.className = 'detail-row';
  tr.dataset.detailFor = item.id;

  let html = '<td colspan="6"><div class="detail-content">';

  // Evidence
  if (item.evidence) {
    html += '<div><div class="detail-section-label">Evidence</div><div class="detail-evidence">' + escapeHtml(item.evidence) + '</div></div>';
  }

  // N/A reason
  if (item.status === 'na' && item.reason) {
    html += '<div><div class="detail-section-label">Reason</div><div class="detail-na-reason">' + escapeHtml(item.reason) + '</div></div>';
  }

  // Gap
  if (item.gap) {
    html += '<div><div class="detail-section-label">Gap Identified</div><div class="detail-gap">' + escapeHtml(item.gap) + '</div></div>';
  }

  // Recommendation
  if (item.recommendation) {
    html += '<div><div class="detail-section-label">Recommendation</div><div class="detail-recommendation">' + escapeHtml(item.recommendation) + '</div></div>';
  }

  // Confidence note
  html += '<div class="detail-confidence-note">' + CONFIDENCE_NOTES[item.confidence] + '</div>';

  // Action buttons
  html += '<div class="detail-actions">';
  html += '<button class="btn-approve" onclick="setReview(\'' + item.id + '\', \'approved\', event)">Approve</button>';
  html += '<button class="btn-reject" onclick="setReview(\'' + item.id + '\', \'rejected\', event)">Reject</button>';
  html += '</div>';

  html += '</div></td>';
  tr.innerHTML = html;
  return tr;
}

// ── Toggle expansion ─────────────────────────────
function toggleExpand(id) {
  if (expandedId === id) {
    expandedId = null;
  } else {
    expandedId = id;
  }
  render();
}

// ── Set review status ────────────────────────────
function setReview(id, status, event) {
  event.stopPropagation();
  const item = DATA.find(d => d.id === id);
  if (item) {
    item.review = status;
  }
  updateReviewedCount();
  render();
}

// ── Update reviewed count ────────────────────────
function updateReviewedCount() {
  const count = DATA.filter(d => d.review !== 'pending').length;
  document.getElementById('reviewedCount').textContent = count;
}

// ── Render table ─────────────────────────────────
function render() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  const filtered = getFiltered();

  filtered.forEach(item => {
    tbody.appendChild(buildDataRow(item));
    if (expandedId === item.id) {
      tbody.appendChild(buildDetailRow(item));
    }
  });

  document.getElementById('filterCount').textContent = 'Showing ' + filtered.length + ' of ' + DATA.length;
  updateReviewedCount();
}

// ── Export CSV ────────────────────────────────────
function exportCSV() {
  const filtered = getFiltered();
  const headers = ['ID', 'Title', 'Clause', 'Status', 'Confidence', 'Review', 'Gap', 'Evidence', 'Recommendation', 'Reason'];
  const rows = filtered.map(d => [
    d.id,
    '"' + (d.title || '').replace(/"/g, '""') + '"',
    d.clause,
    d.status,
    d.confidence,
    d.review,
    '"' + (d.gap || '').replace(/"/g, '""') + '"',
    '"' + (d.evidence || '').replace(/"/g, '""') + '"',
    '"' + (d.recommendation || '').replace(/"/g, '""') + '"',
    '"' + (d.reason || '').replace(/"/g, '""') + '"'
  ]);

  let csv = headers.join(',') + '\n';
  rows.forEach(r => { csv += r.join(',') + '\n'; });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'compliance-report.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Helpers ──────────────────────────────────────
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ── Init ─────────────────────────────────────────
populateClauses();
render();

document.getElementById('filterStatus').addEventListener('change', function() { expandedId = null; render(); });
document.getElementById('filterClause').addEventListener('change', function() { expandedId = null; render(); });
document.getElementById('filterConfidence').addEventListener('change', function() { expandedId = null; render(); });
document.getElementById('filterSearch').addEventListener('input', function() { expandedId = null; render(); });
document.getElementById('btnExportTop').addEventListener('click', exportCSV);
document.getElementById('btnExportBottom').addEventListener('click', exportCSV);
</script>
