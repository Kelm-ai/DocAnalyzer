<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SC-05 Sequential Review — Suttons Creek Compliance</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Lato', ui-sans-serif, system-ui, sans-serif;
    background: #F7F9F9; color: #2D1A33;
    min-height: 100vh; display: flex; flex-direction: column;
  }

  /* Header */
  .header {
    border-top: 2px solid #FFC000; background: #FFF; height: 56px;
    border-bottom: 1px solid #E2E5E8; display: flex; align-items: center;
    justify-content: space-between; padding: 0 24px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo {
    width: 32px; height: 32px; background: #00978F; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: #FFF; font-weight: 700; font-size: 13px; letter-spacing: 0.02em;
  }
  .header-title { font-weight: 300; font-size: 18px; letter-spacing: 0.025em; color: #00978F; }
  .header-nav { display: flex; gap: 24px; }
  .header-nav a {
    text-decoration: none; font-size: 14px; font-weight: 400; color: #6B7280;
    padding: 16px 0; border-bottom: 2px solid transparent;
  }
  .header-nav a.active { color: #00978F; border-bottom-color: #00978F; }

  /* Progress Bar */
  .progress-zone {
    background: #FFF; border-bottom: 1px solid #E2E5E8;
    padding: 12px 24px 10px; position: sticky; top: 56px; z-index: 99;
  }
  .progress-track { width: 100%; height: 4px; background: #E2E5E8; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #00978F; border-radius: 2px; transition: width 0.35s ease; }
  .progress-label { text-align: center; font-size: 14px; color: #6B7280; margin-top: 8px; }

  /* Page Title */
  .page-title-area { text-align: center; padding: 24px 24px 0; }
  .page-title-label {
    font-weight: 300; font-size: 18px; letter-spacing: 0.08em;
    color: #52315B; text-transform: uppercase;
  }
  .page-title-meta { font-size: 13px; color: #6B7280; margin-top: 4px; }

  /* Main Wrap */
  .main-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 24px 0; }

  /* Review Card */
  .review-card {
    background: #FFF; border: 1px solid #E2E5E8; border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05); padding: 32px;
    max-width: 640px; width: 100%;
    transition: box-shadow 0.25s ease, opacity 0.2s ease, transform 0.2s ease;
  }

  /* Status Pills */
  .pill-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .pill {
    display: inline-flex; align-items: center; padding: 4px 12px;
    border-radius: 9999px; font-size: 14px; font-weight: 600; text-transform: capitalize;
  }
  .pill-pass { color: #0D7A6F; background: #E6F5F3; }
  .pill-fail { color: #DC2626; background: #FEF2F2; }
  .pill-flagged { color: #946000; background: #FFF8E1; }
  .pill-na { color: #6B7280; background: #F3F4F6; }
  .pill-conf { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 9999px; }
  .pill-conf-high { color: #0D7A6F; background: #E6F5F3; }
  .pill-conf-medium { color: #946000; background: #FFF8E1; }
  .pill-conf-low { color: #6B7280; background: #F3F4F6; }

  /* Requirement Title & Meta */
  .req-title { font-weight: 600; font-size: 22px; color: #2D1A33; margin-bottom: 6px; line-height: 1.3; }
  .req-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .req-id { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; color: #6B7280; }
  .clause-tag { font-size: 12px; color: #6B7280; background: #F3F4F6; padding: 2px 8px; border-radius: 4px; }

  /* Section Labels */
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: #6B7280; margin-bottom: 8px;
  }

  /* Evidence */
  .evidence-block {
    border-left: 3px solid #00978F; background: #F7F9F9; padding: 16px;
    font-style: italic; color: #4B5563; border-radius: 0 6px 6px 0;
    margin-bottom: 20px; line-height: 1.6;
  }
  .evidence-empty {
    border-left: 3px solid #E2E5E8; background: #F7F9F9; padding: 16px;
    color: #9CA3AF; border-radius: 0 6px 6px 0; margin-bottom: 20px; font-style: italic;
  }

  /* Gap */
  .gap-box {
    background: #FEF2F2; border-left: 3px solid #DC2626; padding: 16px;
    color: #DC2626; border-radius: 0 6px 6px 0; margin-bottom: 20px; line-height: 1.6;
  }

  /* Recommendation */
  .rec-box {
    background: #E8F5F4; padding: 16px; color: #2D1A33;
    border-radius: 6px; margin-bottom: 20px; line-height: 1.6;
  }

  /* N/A Reason */
  .na-reason { color: #6B7280; margin-bottom: 20px; line-height: 1.6; }

  /* Confidence Explanation */
  .conf-explanation { color: #6B7280; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }

  /* AI Notice */
  .ai-notice {
    font-size: 12px; color: #9CA3AF; text-align: center;
    margin-top: 8px; padding-top: 16px; border-top: 1px solid #E2E5E8;
  }

  /* Review State Badge */
  .review-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 13px;
    font-weight: 600; padding: 4px 12px; border-radius: 9999px; margin-bottom: 14px;
  }
  .review-badge-approved { color: #0D7A6F; background: #E6F5F3; }
  .review-badge-rejected { color: #DC2626; background: #FEF2F2; }

  /* Action Bar */
  .action-bar {
    max-width: 640px; width: 100%; display: flex;
    align-items: center; justify-content: center; gap: 12px; padding: 20px 0 8px;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 6px;
    cursor: pointer; transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
    border: none; outline: none; user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { box-shadow: 0 0 0 2px #FFF, 0 0 0 4px #00978F; }
  .btn-primary { background: #00978F; color: #FFF; width: 140px; height: 40px; }
  .btn-primary:hover { background: #005C57; }
  .btn-destructive { background: #DC2626; color: #FFF; width: 140px; height: 40px; }
  .btn-destructive:hover { background: #B91C1C; }
  .btn-ghost { background: transparent; color: #6B7280; width: 100px; height: 40px; border: 1px solid transparent; }
  .btn-ghost:hover { background: #F0F6F6; }
  .btn-secondary {
    background: #FFF; color: #6B7280; border: 1px solid #E2E5E8; height: 36px;
    padding: 0 16px; border-radius: 6px; font-family: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  .btn-secondary:hover { background: #F0F6F6; }

  /* Navigation Bar */
  .nav-bar {
    max-width: 640px; width: 100%; display: flex;
    align-items: center; justify-content: space-between; padding: 12px 0 32px;
  }
  .dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #E2E5E8;
    transition: all 0.2s; cursor: pointer;
  }
  .dot:hover { transform: scale(1.3); }
  .dot-approved { background: #0D9488; }
  .dot-rejected { background: #DC2626; }
  .dot-current { box-shadow: 0 0 0 3px rgba(0,151,143,0.25); outline: 2px solid #00978F; }

  /* Keyboard Hint */
  .keyboard-hint { text-align: center; font-size: 12px; color: #9CA3AF; padding: 0 0 16px; }
  .kbd {
    display: inline-block; background: #F3F4F6; border: 1px solid #E2E5E8;
    border-radius: 3px; padding: 1px 6px;
    font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; color: #6B7280;
  }

  /* Completion Screen */
  .completion-card {
    background: #FFF; border: 1px solid #E2E5E8; border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05); padding: 32px; max-width: 640px; width: 100%;
  }
  .completion-heading { font-weight: 600; font-size: 24px; color: #2D1A33; text-align: center; margin-bottom: 6px; }
  .completion-sub { font-size: 14px; color: #6B7280; text-align: center; margin-bottom: 24px; }
  .stats-row { display: flex; justify-content: center; gap: 32px; margin-bottom: 28px; }
  .stat-item { text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; }
  .stat-num-approved { color: #0D9488; }
  .stat-num-rejected { color: #DC2626; }
  .stat-num-pending { color: #9CA3AF; }
  .stat-label {
    font-size: 12px; color: #6B7280; text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600; margin-top: 2px;
  }
  .group-heading {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: #6B7280; margin: 20px 0 8px;
    padding-bottom: 6px; border-bottom: 1px solid #E2E5E8;
  }
  .group-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; font-size: 14px;
  }
  .group-item-title { color: #2D1A33; }
  .group-item-id { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; color: #6B7280; }
  .btn-export {
    background: #00978F; color: #FFF; width: 100%; height: 44px; font-size: 15px;
    font-weight: 600; border-radius: 6px; border: none; cursor: pointer;
    margin-top: 24px; font-family: inherit; transition: background 0.15s;
  }
  .btn-export:hover { background: #005C57; }
  .btn-back {
    background: #FFF; color: #6B7280; border: 1px solid #E2E5E8; width: 100%;
    height: 40px; font-size: 14px; font-weight: 600; border-radius: 6px;
    cursor: pointer; margin-top: 10px; font-family: inherit; transition: background 0.15s;
  }
  .btn-back:hover { background: #F0F6F6; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="header-logo">SC</div>
    <span class="header-title">Suttons Creek Compliance</span>
  </div>
  <nav class="header-nav">
    <a href="#">Upload</a>
    <a href="#">Frameworks</a>
    <a href="#" class="active">Evaluation</a>
  </nav>
</header>

<!-- Progress -->
<div class="progress-zone" id="progressZone">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<!-- Page Title -->
<div class="page-title-area" id="pageTitleArea">
  <div class="page-title-label">Compliance Report</div>
  <div class="page-title-meta">ISO 27001 &middot; Information Security Policy v2.3 &middot; Sequential Review</div>
</div>

<!-- Review View -->
<div class="main-wrap" id="reviewView">
  <div class="review-card" id="reviewCard"></div>
  <div class="action-bar" id="actionBar"></div>
  <nav class="nav-bar" id="navBar"></nav>
  <div class="keyboard-hint">
    <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> to navigate
  </div>
</div>

<!-- Completion View -->
<div class="main-wrap hidden" id="completionView">
  <div class="completion-card" id="completionCard"></div>
</div>

<script>
const DATA = [
  { id:"REQ-6.1.2", title:"Risk Assessment Process", clause:"6.1", status:"fail", confidence:"medium",
    gap:"No documented risk assessment methodology found. The policy references risk management in general terms but lacks a specific, repeatable process.",
    evidence:"The organization shall ensure information security risks are managed appropriately (Section 4.2)",
    recommendation:"Develop and document a formal risk assessment methodology.", reason:null, review:"pending" },
  { id:"REQ-8.1.1", title:"Operational Planning and Control", clause:"8.1", status:"fail", confidence:"high",
    gap:"Missing documented operational procedures for security controls.",
    evidence:"Security controls shall be implemented as deemed necessary by management (Section 7.1)",
    recommendation:"Create detailed operational procedures for each security control.", reason:null, review:"pending" },
  { id:"REQ-6.2.1", title:"Information Security Objectives", clause:"6.2", status:"fail", confidence:"high",
    gap:"No measurable information security objectives defined.",
    evidence:"The organization is committed to maintaining a high level of information security (Section 1.3)",
    recommendation:"Define SMART information security objectives.", reason:null, review:"pending" },
  { id:"REQ-7.2.1", title:"Competence Requirements", clause:"7.2", status:"flagged", confidence:"low",
    gap:"Partial competence framework found but missing evidence of implementation.",
    evidence:"Staff shall receive appropriate information security training upon joining and annually thereafter (Section 5.4)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-9.1.1", title:"Monitoring and Measurement", clause:"9.1", status:"flagged", confidence:"medium",
    gap:"Monitoring requirements mentioned but no specific metrics or KPIs defined.",
    evidence:"Information security performance shall be monitored and reported to management (Section 8.2)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-9.3.1", title:"Management Review Inputs", clause:"9.3", status:"flagged", confidence:"medium",
    gap:"Management review process exists but input requirements are incomplete.",
    evidence:"Management shall review the ISMS at planned intervals (Section 9.1)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-5.1.1", title:"Leadership Commitment", clause:"5.1", status:"pass", confidence:"high",
    gap:null, evidence:"The Board of Directors and Senior Management are committed to supporting information security (Section 2.1)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-5.2.1", title:"Information Security Policy", clause:"5.2", status:"pass", confidence:"high",
    gap:null, evidence:"This Information Security Policy establishes the framework for managing information security risks (Section 1.1)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-5.3.1", title:"Organizational Roles", clause:"5.3", status:"pass", confidence:"medium",
    gap:null, evidence:"The CISO is responsible for the overall ISMS. Department heads implement controls in their areas (Section 3.1)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-7.1.1", title:"Resources", clause:"7.1", status:"pass", confidence:"high",
    gap:null, evidence:"The organization shall provide resources needed for the ISMS including budget allocation reviewed annually (Section 5.1)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-7.3.1", title:"Awareness", clause:"7.3", status:"pass", confidence:"high",
    gap:null, evidence:"All employees shall be made aware of the information security policy (Section 5.5)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-7.4.1", title:"Communication", clause:"7.4", status:"pass", confidence:"medium",
    gap:null, evidence:"Internal and external communications shall follow the defined communication plan (Section 5.6)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-9.2.1", title:"Internal Audit", clause:"9.2", status:"pass", confidence:"high",
    gap:null, evidence:"Internal audits shall be conducted at planned intervals, at least annually (Section 8.3)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-7.5.1", title:"Documented Information", clause:"7.5", status:"pass", confidence:"high",
    gap:null, evidence:"All ISMS documentation shall be controlled, versioned, and maintained (Section 5.7)",
    recommendation:null, reason:null, review:"pending" },
  { id:"REQ-8.2.1", title:"Risk Assessment (Separate)", clause:"8.2", status:"na", confidence:"high",
    gap:null, evidence:null, recommendation:null, reason:"Assessed under REQ-6.1.2", review:"pending" }
];

const CONFIDENCE_TEXT = {
  high: "High confidence: Strong, explicit evidence found in the document directly addressing this requirement.",
  medium: "Medium confidence: Partial or indirect evidence found. The document references the topic but may lack specificity.",
  low: "Low confidence: Weak or ambiguous evidence. Interpretation required; manual review strongly recommended."
};

let currentIndex = 0;
let visited = new Set();
let advancing = false;

/* Helpers */
function statusLabel(s) {
  if (s === 'na') return 'N/A';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function pillClass(s) { return 'pill-' + (s === 'na' ? 'na' : s); }
function confClass(c) { return 'pill-conf-' + c; }

/* Progress */
function updateProgress() {
  var pct = ((currentIndex + 1) / DATA.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  var reviewed = DATA.filter(function(d) { return d.review !== 'pending'; }).length;
  document.getElementById('progressLabel').textContent =
    'Requirement ' + (currentIndex + 1) + ' of ' + DATA.length + ' \u00B7 ' + reviewed + ' reviewed';
}

/* Card Rendering */
function renderCard() {
  var item = DATA[currentIndex];
  visited.add(currentIndex);
  var html = '';

  /* Review badge if already reviewed */
  if (item.review === 'approved') {
    html += '<div class="review-badge review-badge-approved">';
    html += '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:middle">';
    html += '<path d="M13.3 4.3 6.5 11.1 2.7 7.3" stroke="#0D7A6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    html += '</svg> Approved</div>';
  } else if (item.review === 'rejected') {
    html += '<div class="review-badge review-badge-rejected">';
    html += '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="vertical-align:middle">';
    html += '<path d="M4 4l8 8M12 4l-8 8" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>';
    html += '</svg> Rejected</div>';
  }

  /* Status + Confidence pills */
  html += '<div class="pill-row">';
  html += '<span class="pill ' + pillClass(item.status) + '">' + statusLabel(item.status) + '</span>';
  html += '<span class="pill pill-conf ' + confClass(item.confidence) + '">';
  html += item.confidence.charAt(0).toUpperCase() + item.confidence.slice(1) + ' Confidence</span>';
  html += '</div>';

  /* Title */
  html += '<div class="req-title">' + item.title + '</div>';

  /* ID + Clause */
  html += '<div class="req-meta">';
  html += '<span class="req-id">' + item.id + '</span>';
  html += '<span class="clause-tag">Clause ' + item.clause + '</span>';
  html += '</div>';

  /* Evidence */
  html += '<div class="section-label">Evidence</div>';
  if (item.evidence) {
    html += '<div class="evidence-block">\u201C' + item.evidence + '\u201D</div>';
  } else {
    html += '<div class="evidence-empty">No evidence applicable</div>';
  }

  /* Gap */
  if (item.gap) {
    html += '<div class="section-label">Gap Identified</div>';
    html += '<div class="gap-box">' + item.gap + '</div>';
  }

  /* Recommendation */
  if (item.recommendation) {
    html += '<div class="section-label">Recommendation</div>';
    html += '<div class="rec-box">' + item.recommendation + '</div>';
  }

  /* N/A Reason */
  if (item.status === 'na' && item.reason) {
    html += '<div class="section-label">Reason (N/A)</div>';
    html += '<div class="na-reason">' + item.reason + '</div>';
  }

  /* Confidence explanation */
  html += '<div class="section-label">AI Confidence</div>';
  html += '<div class="conf-explanation">' + CONFIDENCE_TEXT[item.confidence] + '</div>';

  /* AI notice */
  html += '<div class="ai-notice">AI assessment \u2014 human verification required</div>';

  document.getElementById('reviewCard').innerHTML = html;
}

/* Action Buttons */
function renderActions() {
  var html = '';
  html += '<button class="btn btn-primary" id="btnApprove" onclick="doApprove()">Approve</button>';
  html += '<button class="btn btn-ghost" id="btnSkip" onclick="doSkip()">Skip</button>';
  html += '<button class="btn btn-destructive" id="btnReject" onclick="doReject()">Reject</button>';
  document.getElementById('actionBar').innerHTML = html;
}

/* Navigation Dots */
function renderNav() {
  var html = '';

  /* Previous button */
  html += '<button class="btn btn-secondary" onclick="goPrev()"';
  if (currentIndex === 0) html += ' disabled style="opacity:0.4;cursor:default"';
  html += '>\u2190 Previous</button>';

  /* Dots */
  html += '<div class="dots">';
  for (var i = 0; i < DATA.length; i++) {
    var cls = 'dot';
    if (DATA[i].review === 'approved') cls += ' dot-approved';
    else if (DATA[i].review === 'rejected') cls += ' dot-rejected';
    if (i === currentIndex) cls += ' dot-current';
    html += '<span class="' + cls + '" onclick="goTo(' + i + ')" title="' + DATA[i].id + '"></span>';
  }
  html += '</div>';

  /* Next button */
  html += '<button class="btn btn-secondary" onclick="goNext()"';
  if (currentIndex === DATA.length - 1) html += ' disabled style="opacity:0.4;cursor:default"';
  html += '>Next \u2192</button>';

  document.getElementById('navBar').innerHTML = html;
}

/* Master Render */
function renderAll() {
  updateProgress();
  renderCard();
  renderActions();
  renderNav();
}

/* Card Transition Animation */
function animateCardTransition(direction, callback) {
  var card = document.getElementById('reviewCard');
  var exitX = direction === 'forward' ? '-24px' : '24px';
  var enterX = direction === 'forward' ? '24px' : '-24px';

  card.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
  card.style.opacity = '0';
  card.style.transform = 'translateX(' + exitX + ')';

  setTimeout(function() {
    callback();
    card.style.transform = 'translateX(' + enterX + ')';
    requestAnimationFrame(function() {
      card.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
      card.style.opacity = '1';
      card.style.transform = 'translateX(0)';
    });
  }, 150);
}

/* Flash & Advance */
function flashAndAdvance(color) {
  if (advancing) return;
  advancing = true;

  var card = document.getElementById('reviewCard');
  card.style.transition = 'box-shadow 0.2s';
  card.style.boxShadow = color === 'green'
    ? '0 0 0 3px rgba(13, 148, 136, 0.5)'
    : '0 0 0 3px rgba(220, 38, 38, 0.5)';

  setTimeout(function() {
    card.style.boxShadow = '0 1px 2px rgba(0,0,0,0.05)';
    if (currentIndex < DATA.length - 1) {
      animateCardTransition('forward', function() {
        currentIndex++;
        renderAll();
      });
      setTimeout(function() { advancing = false; }, 200);
    } else {
      advancing = false;
      checkCompletion();
    }
  }, 350);
}

/* Review Actions */
function doApprove() {
  if (advancing) return;
  DATA[currentIndex].review = 'approved';
  flashAndAdvance('green');
}

function doReject() {
  if (advancing) return;
  DATA[currentIndex].review = 'rejected';
  flashAndAdvance('red');
}

function doSkip() {
  if (advancing) return;
  if (currentIndex < DATA.length - 1) {
    animateCardTransition('forward', function() {
      currentIndex++;
      renderAll();
    });
  } else {
    checkCompletion();
  }
}

/* Navigation */
function goPrev() {
  if (currentIndex > 0) {
    animateCardTransition('back', function() {
      currentIndex--;
      renderAll();
    });
  }
}

function goNext() {
  if (currentIndex < DATA.length - 1) {
    animateCardTransition('forward', function() {
      currentIndex++;
      renderAll();
    });
  } else {
    checkCompletion();
  }
}

function goTo(i) {
  if (i === currentIndex) return;
  var dir = i > currentIndex ? 'forward' : 'back';
  animateCardTransition(dir, function() {
    currentIndex = i;
    renderAll();
  });
}

/* Completion Check */
function checkCompletion() {
  if (visited.size >= DATA.length) {
    showCompletion();
  } else {
    renderAll();
  }
}

/* Completion Screen */
function showCompletion() {
  document.getElementById('reviewView').classList.add('hidden');
  document.getElementById('completionView').classList.remove('hidden');
  document.getElementById('progressZone').classList.add('hidden');
  document.getElementById('pageTitleArea').classList.add('hidden');

  var approved = DATA.filter(function(d) { return d.review === 'approved'; });
  var rejected = DATA.filter(function(d) { return d.review === 'rejected'; });
  var pending  = DATA.filter(function(d) { return d.review === 'pending'; });

  var html = '';
  html += '<div class="completion-heading">Review Complete</div>';
  html += '<div class="completion-sub">All ' + DATA.length + ' requirements have been visited.</div>';

  /* Stats */
  html += '<div class="stats-row">';
  html += '<div class="stat-item"><div class="stat-num stat-num-approved">' + approved.length + '</div>';
  html += '<div class="stat-label">Approved</div></div>';
  html += '<div class="stat-item"><div class="stat-num stat-num-rejected">' + rejected.length + '</div>';
  html += '<div class="stat-label">Rejected</div></div>';
  html += '<div class="stat-item"><div class="stat-num stat-num-pending">' + pending.length + '</div>';
  html += '<div class="stat-label">Pending</div></div>';
  html += '</div>';

  /* Grouped lists */
  if (approved.length) {
    html += '<div class="group-heading">Approved (' + approved.length + ')</div>';
    for (var a = 0; a < approved.length; a++) {
      html += '<div class="group-item"><span class="group-item-title">' + approved[a].title + '</span>';
      html += '<span class="group-item-id">' + approved[a].id + '</span></div>';
    }
  }
  if (rejected.length) {
    html += '<div class="group-heading">Rejected (' + rejected.length + ')</div>';
    for (var r = 0; r < rejected.length; r++) {
      html += '<div class="group-item"><span class="group-item-title">' + rejected[r].title + '</span>';
      html += '<span class="group-item-id">' + rejected[r].id + '</span></div>';
    }
  }
  if (pending.length) {
    html += '<div class="group-heading">Pending (' + pending.length + ')</div>';
    for (var p = 0; p < pending.length; p++) {
      html += '<div class="group-item"><span class="group-item-title">' + pending[p].title + '</span>';
      html += '<span class="group-item-id">' + pending[p].id + '</span></div>';
    }
  }

  html += '<button class="btn-export" onclick="doExport()">Export Review Report</button>';
  html += '<button class="btn-back" onclick="backToReview()">Back to Review</button>';

  document.getElementById('completionCard').innerHTML = html;
}

/* Back to Review */
function backToReview() {
  document.getElementById('completionView').classList.add('hidden');
  document.getElementById('reviewView').classList.remove('hidden');
  document.getElementById('progressZone').classList.remove('hidden');
  document.getElementById('pageTitleArea').classList.remove('hidden');
  renderAll();
}

/* Export */
function doExport() {
  var approved = DATA.filter(function(d) { return d.review === 'approved'; });
  var rejected = DATA.filter(function(d) { return d.review === 'rejected'; });
  var pending  = DATA.filter(function(d) { return d.review === 'pending'; });

  var text = '';
  text += 'COMPLIANCE REVIEW REPORT\n';
  text += '========================\n';
  text += 'ISO 27001 - Information Security Policy v2.3\n';
  text += 'Generated: ' + new Date().toLocaleDateString() + '\n\n';
  text += 'SUMMARY\n';
  text += '--------\n';
  text += 'Total Requirements: ' + DATA.length + '\n';
  text += 'Approved: ' + approved.length + '\n';
  text += 'Rejected: ' + rejected.length + '\n';
  text += 'Pending:  ' + pending.length + '\n\n';

  function buildSection(label, items) {
    if (!items.length) return '';
    var s = label.toUpperCase() + '\n' + '-'.repeat(40) + '\n';
    for (var i = 0; i < items.length; i++) {
      var d = items[i];
      s += d.id + '  ' + d.title + '\n';
      s += '  Status: ' + statusLabel(d.status) + ' | Confidence: ' + d.confidence + '\n';
      if (d.evidence) s += '  Evidence: ' + d.evidence + '\n';
      if (d.gap) s += '  Gap: ' + d.gap + '\n';
      if (d.recommendation) s += '  Recommendation: ' + d.recommendation + '\n';
      if (d.reason) s += '  Reason: ' + d.reason + '\n';
      s += '\n';
    }
    return s;
  }

  text += buildSection('Approved', approved);
  text += buildSection('Rejected', rejected);
  text += buildSection('Pending', pending);

  var blob = new Blob([text], { type: 'text/plain' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'compliance-review-report.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Keyboard Navigation */
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('completionView').classList.contains('hidden')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
});

/* Initialize */
renderAll();
</script>
</body>
</html>
