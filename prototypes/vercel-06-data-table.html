<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Table — Compliance Report</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #000;
    background: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 16px;
    border-bottom: 1px solid #eaeaea;
  }

  .header-left {
    font-size: 16px;
    font-weight: 600;
    color: #000;
  }

  .header-right {
    font-size: 13px;
    color: #888;
  }

  .header-right span + span::before {
    content: "\00b7";
    margin: 0 8px;
  }

  .ai-notice {
    margin-top: 12px;
    font-size: 12px;
    color: #aaa;
  }

  /* Filter bar */
  .filter-bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .filter-toggles {
    display: flex;
    gap: 20px;
    align-items: baseline;
  }

  .filter-toggles button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    font-size: 14px;
    color: #888;
    cursor: pointer;
    padding: 0 0 4px 0;
    transition: color 0.15s, border-color 0.15s;
    line-height: 1.4;
  }

  .filter-toggles button:hover {
    color: #000;
  }

  .filter-toggles button.active {
    color: #000;
    border-bottom-color: #000;
  }

  .filter-right {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  .search-input {
    font-family: inherit;
    font-size: 13px;
    color: #000;
    border: none;
    border-bottom: 1px solid #eaeaea;
    outline: none;
    padding: 2px 0;
    width: 180px;
    background: transparent;
    transition: border-color 0.15s;
  }

  .search-input::placeholder {
    color: #ccc;
  }

  .search-input:focus {
    border-bottom-color: #000;
  }

  .result-count {
    font-size: 12px;
    color: #aaa;
    white-space: nowrap;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }

  thead th {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
    text-align: left;
    padding: 10px 16px;
    border-bottom: 2px solid #000;
    white-space: nowrap;
  }

  thead th:first-child {
    padding-left: 16px;
    width: 30px;
  }

  tbody tr {
    cursor: pointer;
    transition: background 0.1s;
  }

  tbody tr:hover {
    background: #fafafa;
  }

  tbody tr.row-focused {
    background: #fafafa;
  }

  tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
    vertical-align: middle;
  }

  tbody td:first-child {
    padding-left: 16px;
    width: 30px;
  }

  /* Status dot cell */
  .cell-dot {
    width: 30px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  .status-dot.fail { background: #000; }
  .status-dot.flagged { background: #999; }
  .status-dot.pass { background: #ccc; }
  .status-dot.na { background: #e5e5e5; }

  .review-indicator {
    font-size: 11px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* ID cell */
  .cell-id {
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 12px;
    color: #000;
    white-space: nowrap;
  }

  /* Title cell */
  .cell-title {
    color: #000;
  }

  /* Clause cell */
  .cell-clause {
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 12px;
    color: #888;
    white-space: nowrap;
  }

  /* Confidence cell */
  .cell-confidence {
    font-size: 13px;
    white-space: nowrap;
  }

  .confidence-high { color: #000; }
  .confidence-medium { color: #666; }
  .confidence-low { color: #aaa; }

  /* Status text cell */
  .cell-status {
    font-size: 13px;
    white-space: nowrap;
  }

  .status-text-fail { color: #000; }
  .status-text-flagged { color: #666; }
  .status-text-pass { color: #999; }
  .status-text-na { color: #aaa; }

  /* Expanded detail row */
  tr.detail-row td {
    padding: 0;
    border-bottom: 1px solid #f0f0f0;
    cursor: default;
  }

  tr.detail-row:hover {
    background: transparent;
  }

  .detail-content {
    padding: 8px 16px 24px 32px;
    border-left: 2px solid #eaeaea;
    margin-left: 30px;
    margin-right: 16px;
    font-size: 14px;
    line-height: 1.7;
    color: #000;
  }

  .detail-evidence {
    font-style: italic;
    color: #444;
    margin-bottom: 12px;
  }

  .detail-evidence::before {
    content: "\201C";
  }

  .detail-evidence::after {
    content: "\201D";
  }

  .detail-line {
    margin-top: 8px;
  }

  .detail-label {
    font-weight: 600;
  }

  .detail-confidence {
    margin-top: 12px;
    color: #888;
    font-size: 13px;
  }

  .detail-na-reason {
    margin-top: 8px;
    color: #888;
  }

  .review-actions {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }

  .btn-approve {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 16px;
    cursor: pointer;
    background: #000;
    color: #fff;
    border: 1px solid #000;
    border-radius: 4px;
    transition: opacity 0.15s;
  }

  .btn-approve:hover {
    opacity: 0.8;
  }

  .btn-approve.selected {
    opacity: 1;
  }

  .btn-approve:not(.selected) {
    opacity: 0.6;
  }

  .btn-reject {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 16px;
    cursor: pointer;
    background: #fff;
    color: #000;
    border: 1px solid #000;
    border-radius: 4px;
    transition: opacity 0.15s;
  }

  .btn-reject:hover {
    opacity: 0.8;
  }

  .btn-reject.selected {
    border-width: 2px;
    font-weight: 600;
  }

  .btn-reject:not(.selected) {
    opacity: 0.6;
  }

  /* Hidden rows */
  tr.hidden {
    display: none;
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #eaeaea;
    font-size: 14px;
    color: #888;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .export-link {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: #000;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: opacity 0.15s;
  }

  .export-link:hover {
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-left">Compliance Report</div>
    <div class="header-right">
      <span>ISMS Policy Document v2.1</span>
      <span>ISO 27001:2022</span>
      <span>2025-01-15</span>
    </div>
  </div>

  <div class="ai-notice">AI assessment &middot; human verification required</div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="filter-toggles">
      <button class="active" data-filter="all">All</button>
      <button data-filter="fail">Failed</button>
      <button data-filter="flagged">Flagged</button>
      <button data-filter="pass">Passed</button>
      <button data-filter="na">N/A</button>
    </div>
    <div class="filter-right">
      <input type="text" class="search-input" id="searchInput" placeholder="Search requirements...">
      <span class="result-count" id="resultCount">15 results</span>
    </div>
  </div>

  <!-- Table -->
  <table>
    <thead>
      <tr>
        <th></th>
        <th>ID</th>
        <th>Title</th>
        <th>Clause</th>
        <th>Confidence</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- Footer -->
  <div class="footer">
    <span id="footerText">0 of 15 reviewed</span>
    <button class="export-link" id="exportBtn">Export</button>
  </div>

</div>

<script>
(function() {

  var DATA = [
    { id:"REQ-6.1.2", title:"Risk Assessment Process", clause:"6.1", status:"fail", confidence:"medium", gap:"No documented risk assessment methodology found. The policy references risk management in general terms but lacks a specific, repeatable process.", evidence:"The organization shall ensure information security risks are managed appropriately (Section 4.2)", recommendation:"Develop and document a formal risk assessment methodology.", reason:null, review:"pending" },
    { id:"REQ-8.1.1", title:"Operational Planning and Control", clause:"8.1", status:"fail", confidence:"high", gap:"Missing documented operational procedures for security controls.", evidence:"Security controls shall be implemented as deemed necessary by management (Section 7.1)", recommendation:"Create detailed operational procedures for each security control.", reason:null, review:"pending" },
    { id:"REQ-6.2.1", title:"Information Security Objectives", clause:"6.2", status:"fail", confidence:"high", gap:"No measurable information security objectives defined.", evidence:"The organization is committed to maintaining a high level of information security (Section 1.3)", recommendation:"Define SMART information security objectives.", reason:null, review:"pending" },
    { id:"REQ-7.2.1", title:"Competence Requirements", clause:"7.2", status:"flagged", confidence:"low", gap:"Partial competence framework found but missing evidence of implementation.", evidence:"Staff shall receive appropriate information security training upon joining and annually thereafter (Section 5.4)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-9.1.1", title:"Monitoring and Measurement", clause:"9.1", status:"flagged", confidence:"medium", gap:"Monitoring requirements mentioned but no specific metrics or KPIs defined.", evidence:"Information security performance shall be monitored and reported to management (Section 8.2)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-9.3.1", title:"Management Review Inputs", clause:"9.3", status:"flagged", confidence:"medium", gap:"Management review process exists but input requirements are incomplete.", evidence:"Management shall review the ISMS at planned intervals (Section 9.1)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-5.1.1", title:"Leadership Commitment", clause:"5.1", status:"pass", confidence:"high", gap:null, evidence:"The Board of Directors and Senior Management are committed to supporting information security (Section 2.1)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-5.2.1", title:"Information Security Policy", clause:"5.2", status:"pass", confidence:"high", gap:null, evidence:"This Information Security Policy establishes the framework for managing information security risks (Section 1.1)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-5.3.1", title:"Organizational Roles", clause:"5.3", status:"pass", confidence:"medium", gap:null, evidence:"The CISO is responsible for the overall ISMS. Department heads implement controls in their areas (Section 3.1)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-7.1.1", title:"Resources", clause:"7.1", status:"pass", confidence:"high", gap:null, evidence:"The organization shall provide resources needed for the ISMS including budget allocation reviewed annually (Section 5.1)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-7.3.1", title:"Awareness", clause:"7.3", status:"pass", confidence:"high", gap:null, evidence:"All employees shall be made aware of the information security policy (Section 5.5)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-7.4.1", title:"Communication", clause:"7.4", status:"pass", confidence:"medium", gap:null, evidence:"Internal and external communications shall follow the defined communication plan (Section 5.6)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-9.2.1", title:"Internal Audit", clause:"9.2", status:"pass", confidence:"high", gap:null, evidence:"Internal audits shall be conducted at planned intervals, at least annually (Section 8.3)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-7.5.1", title:"Documented Information", clause:"7.5", status:"pass", confidence:"high", gap:null, evidence:"All ISMS documentation shall be controlled, versioned, and maintained (Section 5.7)", recommendation:null, reason:null, review:"pending" },
    { id:"REQ-8.2.1", title:"Risk Assessment (Separate)", clause:"8.2", status:"na", confidence:"high", gap:null, evidence:null, recommendation:null, reason:"Assessed under REQ-6.1.2", review:"pending" }
  ];

  var CONFIDENCE_EXPLANATIONS = {
    high: "High confidence: Strong, explicit evidence found in the document directly addressing this requirement.",
    medium: "Medium confidence: Partial or indirect evidence found. The document references the topic but may lack specificity.",
    low: "Low confidence: Weak or ambiguous evidence. Interpretation required; manual review strongly recommended."
  };

  var STATUS_ORDER = { fail: 0, flagged: 1, pass: 2, na: 3 };
  var STATUS_LABELS = { fail: "fail", flagged: "flagged", pass: "pass", na: "n/a" };

  DATA.sort(function(a, b) {
    return STATUS_ORDER[a.status] - STATUS_ORDER[b.status];
  });

  var currentFilter = "all";
  var searchQuery = "";
  var expandedId = null;
  var focusedIndex = -1;

  var tbody = document.getElementById("tableBody");
  var resultCount = document.getElementById("resultCount");
  var footerText = document.getElementById("footerText");
  var searchInput = document.getElementById("searchInput");
  var exportBtn = document.getElementById("exportBtn");

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function getFiltered() {
    return DATA.filter(function(r) {
      var matchFilter = currentFilter === "all" || r.status === currentFilter;
      if (!matchFilter) return false;
      if (!searchQuery) return true;
      var q = searchQuery.toLowerCase();
      return (
        r.id.toLowerCase().indexOf(q) !== -1 ||
        r.title.toLowerCase().indexOf(q) !== -1 ||
        r.clause.toLowerCase().indexOf(q) !== -1
      );
    });
  }

  function reviewIndicator(r) {
    if (r.review === "approved") return ' <span class="review-indicator">\u2713</span>';
    if (r.review === "rejected") return ' <span class="review-indicator">\u2715</span>';
    return "";
  }

  function buildDetailHtml(r) {
    var html = '<div class="detail-content">';

    if (r.evidence) {
      html += '<div class="detail-evidence">' + esc(r.evidence) + '</div>';
    }

    if (r.gap) {
      html += '<div class="detail-line"><span class="detail-label">Gap:</span> ' + esc(r.gap) + '</div>';
    }

    if (r.recommendation) {
      html += '<div class="detail-line"><span class="detail-label">Recommendation:</span> ' + esc(r.recommendation) + '</div>';
    }

    if (r.reason) {
      html += '<div class="detail-na-reason"><span class="detail-label">N/A Reason:</span> ' + esc(r.reason) + '</div>';
    }

    if (r.confidence && CONFIDENCE_EXPLANATIONS[r.confidence]) {
      html += '<div class="detail-confidence">' + esc(CONFIDENCE_EXPLANATIONS[r.confidence]) + '</div>';
    }

    html += '<div class="review-actions">';
    html += '<button class="btn-approve' + (r.review === "approved" ? " selected" : "") + '" data-id="' + r.id + '" data-action="approved">Approve</button>';
    html += '<button class="btn-reject' + (r.review === "rejected" ? " selected" : "") + '" data-id="' + r.id + '" data-action="rejected">Reject</button>';
    html += '</div>';

    html += '</div>';
    return html;
  }

  function render() {
    var filtered = getFiltered();
    tbody.innerHTML = "";
    focusedIndex = -1;

    filtered.forEach(function(r, i) {
      // Main row
      var tr = document.createElement("tr");
      tr.setAttribute("data-id", r.id);
      tr.setAttribute("data-index", i);
      tr.className = "data-row";

      // Dot cell
      var tdDot = document.createElement("td");
      tdDot.className = "cell-dot";
      tdDot.innerHTML = '<span class="status-dot ' + r.status + '"></span>' + reviewIndicator(r);
      tr.appendChild(tdDot);

      // ID cell
      var tdId = document.createElement("td");
      tdId.className = "cell-id";
      tdId.textContent = r.id;
      tr.appendChild(tdId);

      // Title cell
      var tdTitle = document.createElement("td");
      tdTitle.className = "cell-title";
      tdTitle.textContent = r.title;
      tr.appendChild(tdTitle);

      // Clause cell
      var tdClause = document.createElement("td");
      tdClause.className = "cell-clause";
      tdClause.textContent = r.clause;
      tr.appendChild(tdClause);

      // Confidence cell
      var tdConf = document.createElement("td");
      tdConf.className = "cell-confidence confidence-" + r.confidence;
      tdConf.textContent = r.confidence;
      tr.appendChild(tdConf);

      // Status cell
      var tdStatus = document.createElement("td");
      tdStatus.className = "cell-status status-text-" + r.status;
      tdStatus.textContent = STATUS_LABELS[r.status];
      tr.appendChild(tdStatus);

      tr.addEventListener("click", function() {
        toggleExpand(r.id);
      });

      tbody.appendChild(tr);

      // Detail row
      var detailTr = document.createElement("tr");
      detailTr.className = "detail-row" + (expandedId === r.id ? "" : " hidden");
      detailTr.setAttribute("data-detail-for", r.id);

      var detailTd = document.createElement("td");
      detailTd.setAttribute("colspan", "6");
      detailTd.innerHTML = buildDetailHtml(r);
      detailTr.appendChild(detailTd);

      tbody.appendChild(detailTr);
    });

    resultCount.textContent = filtered.length + " result" + (filtered.length !== 1 ? "s" : "");
    updateFooter();
  }

  function toggleExpand(id) {
    if (expandedId === id) {
      expandedId = null;
    } else {
      expandedId = id;
    }
    render();
  }

  function updateFooter() {
    var reviewed = 0;
    DATA.forEach(function(r) {
      if (r.review !== "pending") reviewed++;
    });
    footerText.textContent = reviewed + " of " + DATA.length + " reviewed";
  }

  function findById(id) {
    for (var i = 0; i < DATA.length; i++) {
      if (DATA[i].id === id) return DATA[i];
    }
    return null;
  }

  // Filter toggles
  var filterBtns = document.querySelectorAll(".filter-toggles button");
  filterBtns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      filterBtns.forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-filter");
      expandedId = null;
      render();
    });
  });

  // Search
  searchInput.addEventListener("input", function() {
    searchQuery = searchInput.value;
    expandedId = null;
    render();
  });

  // Approve / Reject delegation
  tbody.addEventListener("click", function(e) {
    var btn = e.target.closest(".btn-approve, .btn-reject");
    if (!btn) return;
    e.stopPropagation();

    var id = btn.getAttribute("data-id");
    var action = btn.getAttribute("data-action");
    var r = findById(id);
    if (!r) return;

    if (r.review === action) {
      r.review = "pending";
    } else {
      r.review = action;
    }

    render();
  });

  // Keyboard navigation
  document.addEventListener("keydown", function(e) {
    // Only handle when not focused on search
    if (document.activeElement === searchInput) return;

    var dataRows = tbody.querySelectorAll("tr.data-row");
    if (!dataRows.length) return;

    if (e.key === "ArrowDown" || e.key === "j") {
      e.preventDefault();
      focusedIndex = Math.min(focusedIndex + 1, dataRows.length - 1);
      updateFocus(dataRows);
    } else if (e.key === "ArrowUp" || e.key === "k") {
      e.preventDefault();
      focusedIndex = Math.max(focusedIndex - 1, 0);
      updateFocus(dataRows);
    } else if (e.key === "Enter" || e.key === " ") {
      if (focusedIndex >= 0 && focusedIndex < dataRows.length) {
        e.preventDefault();
        var id = dataRows[focusedIndex].getAttribute("data-id");
        toggleExpand(id);
        // Restore focus index
        var newRows = tbody.querySelectorAll("tr.data-row");
        updateFocus(newRows);
      }
    }
  });

  function updateFocus(dataRows) {
    dataRows.forEach(function(row) {
      row.classList.remove("row-focused");
    });
    if (focusedIndex >= 0 && focusedIndex < dataRows.length) {
      dataRows[focusedIndex].classList.add("row-focused");
      dataRows[focusedIndex].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  // Export
  exportBtn.addEventListener("click", function() {
    var lines = [];
    lines.push("Compliance Report");
    lines.push("ISMS Policy Document v2.1 | ISO 27001:2022 | 2025-01-15");
    lines.push("AI assessment - human verification required");
    lines.push("");
    lines.push("ID            | Title                              | Clause | Confidence | Status  | Review");
    lines.push("-".repeat(100));

    DATA.forEach(function(r) {
      var reviewLabel = r.review === "pending" ? "-" : r.review;
      var line = padRight(r.id, 14) + "| " +
                 padRight(r.title, 35) + "| " +
                 padRight(r.clause, 7) + "| " +
                 padRight(r.confidence, 11) + "| " +
                 padRight(STATUS_LABELS[r.status], 8) + "| " +
                 reviewLabel;
      lines.push(line);
    });

    var reviewed = 0;
    DATA.forEach(function(r) {
      if (r.review !== "pending") reviewed++;
    });

    lines.push("");
    lines.push(reviewed + " of " + DATA.length + " reviewed");

    var blob = new Blob([lines.join("\n")], { type: "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "compliance-report.txt";
    a.click();
    URL.revokeObjectURL(url);
  });

  function padRight(str, len) {
    str = str || "";
    while (str.length < len) str += " ";
    return str;
  }

  // Initial render
  render();

})();
</script>

</body>
</html>
